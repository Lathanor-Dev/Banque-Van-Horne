<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banque Van Horn</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0905; --panel:#17100a; --panel2:#20150d; --ink:#f5e4b8;
  --muted:#b69b68; --gold:#c9943c; --gold2:#f3d58a; --line:#62451f;
  --blue:#4d8fbd; --green:#3f9b67; --red:#b94735; --black:#070503;
}
body{
  font-family: Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at top,#28190e 0%,#100a06 38%,#070503 100%);
  color:var(--ink);
}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0b0704}
::-webkit-scrollbar-thumb{background:#8b642c;border-radius:8px}
h1,h2,h3{letter-spacing:.02em;text-shadow:0 2px 0 #000}
button{transition:.15s ease}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.bvh-sidebar{
  width:255px;background:linear-gradient(180deg,#1b1108,#0d0905);
  border-right:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;
  box-shadow:8px 0 28px #0008;position:relative;
}
.bvh-sidebar:after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:#d09c4a55}
.bvh-brand{text-align:center;padding:8px 0 18px;margin-bottom:18px;border-bottom:1px solid #6d4b2266}
.bvh-brand img{width:128px;max-width:90%;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 16px #000)}
.bvh-brand-title{font-size:27px;line-height:1.02;font-weight:900;color:#f6d27b;text-transform:uppercase;letter-spacing:.045em}
.bvh-brand-date{margin-top:8px;color:#d9b66c;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.bvh-main{flex:1;padding:26px 34px;overflow:auto;background:linear-gradient(180deg,#130d08aa,#090603aa)}
.bvh-nav{display:grid;gap:9px;flex:1;align-content:start}
.bvh-user{margin-top:auto}
.bvh-nav button{
  border:1px solid #4a321966;border-radius:9px;padding:13px 14px;text-align:left;
  font-weight:800;cursor:pointer;color:#cfb57b;background:#120b06;
  box-shadow:inset 0 0 0 1px #0008;
}
.bvh-nav button.active{
  color:#ffe19b;background:linear-gradient(90deg,#4a3216,#2a1a0c);
  border-color:#9f7431;box-shadow:0 0 18px #c9943c22,inset 0 0 0 1px #e0b45a33;
}
.bvh-user{border-top:1px solid #6d4b2266;padding-top:16px;color:#f1d99a}
.bvh-topbar{
  border:1px solid #6d4b22;border-radius:12px;margin-bottom:22px;padding:16px 20px;
  background:linear-gradient(90deg,#25170c,#191007);display:flex;justify-content:space-between;gap:16px;align-items:center;
  box-shadow:inset 0 0 0 1px #000,0 8px 24px #0005;
}
.bvh-topbar small{display:block;color:#c9a567;letter-spacing:.13em;text-transform:uppercase}
.bvh-card{
  background:linear-gradient(180deg,#1d130b,#130c07);border:1px solid #6d4b22;border-radius:14px;
  padding:18px;box-shadow:inset 0 0 0 1px #000,0 12px 28px #0005;position:relative;overflow:hidden;
}
.bvh-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.bvh-card .icon{font-size:27px;margin-bottom:7px}
.bvh-card p{color:#c6aa72;font-size:14px}
.bvh-card h2{font-size:30px;color:#f4c86d;margin-top:4px}
.bvh-grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.bvh-grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
.bvh-ledger{background:linear-gradient(180deg,#1b1109,#100a06);border:1px solid #6d4b22;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.bvh-ledger-title{padding:14px 16px;border-bottom:1px solid #6d4b2266;color:#f0ce80;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.bvh-row{display:grid;grid-template-columns:1.4fr 110px 110px 110px 155px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366}
.bvh-row:first-of-type{border-top:none}
.bvh-empty{padding:28px;text-align:center;color:#d7bc7b}
.bvh-activity{padding:12px 16px;border-top:1px solid #3b281366;color:#d8bf82}
.bvh-activity b{color:#f4d58b}
.bvh-login-logo{width:185px;max-width:90%;display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 16px #000)}
.bvh-login-card{background:linear-gradient(180deg,#1e140b,#100a06);border:1px solid #805a28;border-top:4px solid #c9943c;border-radius:18px;padding:34px;width:420px;box-shadow:0 32px 90px #000}

.bvh-client-list{display:grid;gap:10px;margin-top:16px}
.bvh-client-row{display:grid;grid-template-columns:150px 1.5fr 120px 140px 150px;gap:12px;align-items:center;background:linear-gradient(180deg,#1b1109,#100a06);border:1px solid #6d4b22;border-radius:10px;padding:13px 15px;box-shadow:inset 0 0 0 1px #000;cursor:pointer}
.bvh-client-row:hover{border-color:#c9943c;box-shadow:0 0 18px #c9943c22,inset 0 0 0 1px #000}
.bvh-dossier-head{border:1px solid #7b5528;border-radius:14px;padding:18px 20px;background:linear-gradient(90deg,#28190d,#140c06);display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}
.bvh-dossier-code{color:#f3d58a;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.bvh-dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bvh-field{display:grid;grid-template-columns:150px 1fr;padding:9px 0;border-bottom:1px solid #3b281366;color:#d8bf82}
.bvh-field b{color:#f4d58b}
.bvh-note-box{min-height:140px;border:1px dashed #7b5528;border-radius:10px;padding:14px;color:#b69b68;background:#100a06}

.bvh-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:16px}
.bvh-doc-card{border:1px solid #65451f;border-radius:12px;background:linear-gradient(180deg,#21160d,#120b06);padding:12px;display:flex;gap:12px;align-items:center;min-height:92px;box-shadow:inset 0 0 0 1px #0007}
.bvh-doc-thumb{width:62px;height:62px;border-radius:8px;object-fit:cover;border:1px solid #7b5528;background:#0b0704;display:flex;align-items:center;justify-content:center;font-size:28px;color:#f3d58a;flex:0 0 auto}
.bvh-doc-meta{min-width:0;flex:1;color:#d8bf82;font-size:13px}
.bvh-doc-meta b{display:block;color:#f4d58b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.bvh-doc-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bvh-upload-line{padding:14px 16px;border-top:1px solid #4a321966;display:grid;grid-template-columns:160px 1fr auto;gap:10px;align-items:end}
.bvh-dossier-grid-wide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1100px){.bvh-upload-line{grid-template-columns:1fr}.bvh-dossier-grid-wide{grid-template-columns:1fr}}

@media(max-width:900px){.bvh-client-row{grid-template-columns:1fr}.bvh-dossier-grid{grid-template-columns:1fr}}

@media(max-width:1100px){.bvh-grid-4{grid-template-columns:repeat(2,1fr)}.bvh-grid-2{grid-template-columns:1fr}.bvh-sidebar{width:230px}}

.bvh-note-input{width:100%;background:#120b06;border:1px solid #62451f;border-radius:8px;color:#f8e7b7;padding:12px;font-family:Georgia,serif;font-size:15px;outline:none}
.bvh-note-card{background:linear-gradient(180deg,#f3dfad,#d8b66f);color:#1b1008;border:1px solid #8b642c;border-radius:8px;padding:12px;box-shadow:inset 0 0 18px #5b351033}
.bvh-note-card small{color:#5b3510;font-weight:800}


/* ===== Adaptation téléphone et tablette ===== */
.bvh-mobile-top,.bvh-menu-backdrop{display:none}
.bvh-shell{display:flex;min-height:100vh}

@media (max-width:1100px) and (min-width:761px){
  .bvh-sidebar{width:214px;padding-left:14px;padding-right:14px}
  .bvh-main{padding:22px}
  .bvh-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bvh-grid-2,.bvh-dossier-grid-wide{grid-template-columns:1fr}
}

@media (max-width:760px){
  html,body,#root{min-height:100%;overflow-x:hidden}
  body{font-size:16px}
  .bvh-shell{display:block;min-height:100dvh}
  .bvh-mobile-top{
    display:flex;position:fixed;z-index:250;left:0;right:0;top:0;height:60px;
    align-items:center;gap:11px;padding:8px 12px;
    background:linear-gradient(90deg,#1d120a,#0d0905);border-bottom:1px solid #6d4b22;
    box-shadow:0 6px 18px #0009;
  }
  .bvh-mobile-menu-button{
    width:42px;height:42px;border-radius:9px;border:1px solid #8b642c;
    background:linear-gradient(180deg,#5c3d1c,#2e1b0d);color:#ffe0a0;font-size:21px;cursor:pointer;
  }
  .bvh-mobile-title{min-width:0;line-height:1.05}
  .bvh-mobile-title b{display:block;color:#f6d27b;font-size:16px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bvh-mobile-title span{display:block;color:#c5a261;font-size:10px;text-transform:uppercase;letter-spacing:.16em;margin-top:3px}
  .bvh-menu-backdrop{position:fixed;z-index:240;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .bvh-menu-backdrop.open{display:block;opacity:1;pointer-events:auto}
  .bvh-sidebar{
    position:fixed;z-index:260;top:0;left:0;bottom:0;height:100dvh;width:min(84vw,310px);
    transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;
    padding-top:13px;box-shadow:14px 0 35px #000c;
  }
  .bvh-sidebar.open{transform:translateX(0)}
  .bvh-brand{padding-top:8px;margin-bottom:12px}
  .bvh-brand img{width:155px;max-width:74%;margin-bottom:8px}
  .bvh-brand-title{font-size:24px}
  .bvh-nav{flex:none}
  .bvh-nav button{min-height:48px;font-size:16px}
  .bvh-user{margin-top:16px}
  .bvh-main{width:100%;min-height:100dvh;padding:76px 12px 20px;overflow:visible}
  .bvh-topbar{flex-direction:column;align-items:flex-start;padding:14px;margin-bottom:14px;gap:9px}
  .bvh-topbar h1{font-size:29px;line-height:1.05}
  .bvh-topbar>div:last-child{text-align:left!important}
  .bvh-grid-4,.bvh-grid-2,.bvh-dossier-grid,.bvh-dossier-grid-wide{grid-template-columns:1fr;gap:12px}
  .bvh-card{padding:15px}
  .bvh-card h2{font-size:29px}
  .bvh-client-row{grid-template-columns:1fr 1fr;gap:7px;padding:13px}
  .bvh-client-row>:first-child{grid-column:1/-1}
  .bvh-client-row>:last-child{grid-column:1/-1}
  .bvh-dossier-head{flex-direction:column;padding:15px;gap:12px}
  .bvh-dossier-head h1{font-size:30px;line-height:1.03}
  .bvh-dossier-head>div:last-child{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  .bvh-dossier-head>div:last-child button{width:100%}
  .bvh-field{grid-template-columns:1fr;gap:4px;padding:11px 0}
  .bvh-upload-line{grid-template-columns:1fr;gap:10px;padding:14px}
  .bvh-doc-grid{grid-template-columns:1fr;padding:12px}
  .bvh-doc-card{min-height:82px}
  .bvh-row{display:flex;flex-wrap:wrap;gap:7px;padding:13px 14px}
  .bvh-row>*{min-width:0}
  .bvh-row>b{flex:1 1 52%;font-size:16px}
  .bvh-row>span{flex:1 1 38%}
  .bvh-row>button,.bvh-row>a{flex:1 1 100%;justify-content:center;text-align:center}
  .bvh-ledger-title{padding:13px 14px}
  .bvh-note-box{min-height:110px}
  .bvh-login-card{width:100%;max-width:420px;padding:26px 20px}
  .bvh-login-logo{width:155px}
  input,select,textarea{font-size:16px!important}
  button{min-height:40px}
}

.bvh-agenda-event{min-height:36px}
@media(max-width:760px){
  .bvh-agenda-modal-grid{grid-template-columns:1fr!important}
}


/* ===== Agenda hebdomadaire — présentation calendrier visuel ===== */
.bvh-calendar-panel{background:#100a06;border:1px solid #6d4b22;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #000,0 12px 28px #0005}
.bvh-calendar-toolbar{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #6d4b2266;background:linear-gradient(90deg,#24170c,#140d08)}
.bvh-calendar-title{font-weight:900;color:#f3d58a;font-size:18px;margin-right:auto;white-space:nowrap}
.bvh-view-toggle{display:flex;border:1px solid #765326;border-radius:9px;overflow:hidden;background:#120b06}
.bvh-view-toggle button{border:0;border-radius:0;background:transparent;color:#d8bc78;padding:8px 12px;cursor:pointer;font-weight:800}
.bvh-view-toggle button.active{background:#8b642c;color:#fff}
.bvh-calendar-filter{min-width:190px;flex:1 1 210px}
.bvh-calendar-scroll{overflow:auto;max-height:calc(100vh - 220px);background:#0f0a06}
.bvh-week-grid{min-width:1050px;display:grid;grid-template-columns:72px repeat(var(--days),minmax(130px,1fr));position:relative}
.bvh-calendar-corner{position:sticky;top:0;z-index:50;background:#1c1109;border-right:1px solid #503719;border-bottom:1px solid #765326;min-height:60px}
.bvh-calendar-day-head{position:sticky;top:0;z-index:45;padding:10px 8px;text-align:center;background:linear-gradient(180deg,#25170c,#191007);border-right:1px solid #503719;border-bottom:1px solid #765326;color:#d8bc78;cursor:pointer}
.bvh-calendar-day-head:hover{background:#2d1c0e}
.bvh-calendar-day-head .dow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#b69b68}
.bvh-calendar-day-head .date{display:inline-flex;align-items:center;justify-content:center;margin-top:4px;min-width:30px;height:30px;border-radius:50%;font-weight:900;color:#f5e4b8}
.bvh-calendar-day-head.today .date{background:#c9943c;color:#1b1008}
.bvh-calendar-time-label{height:34px;padding:4px 9px;text-align:right;color:#b69b68;font-size:12px;border-right:1px solid #503719;border-bottom:1px solid #2e1f1066;background:#130c07}
.bvh-calendar-day-column{position:relative;height:1632px;border-right:1px solid #503719;background:#100a06}
.bvh-calendar-slot{height:34px;border-bottom:1px solid #2e1f1066;cursor:pointer}
.bvh-calendar-slot:nth-child(2n+1){border-bottom-color:#4f351a88}
.bvh-calendar-slot:hover{background:#c9943c12}
.bvh-calendar-now{position:absolute;z-index:30;left:0;right:0;height:2px;background:#e24736;pointer-events:none;box-shadow:0 0 0 1px #0005}
.bvh-calendar-now:before{content:"";position:absolute;left:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:#e24736}
.bvh-agenda-event{position:absolute;z-index:20;border:0;border-left:4px solid #f3d58a;border-radius:7px;padding:6px 7px;text-align:left;overflow:hidden;cursor:pointer;box-shadow:0 3px 8px #0007;transition:filter .15s ease,box-shadow .15s ease;min-height:28px}
.bvh-agenda-event:hover{transform:none;filter:brightness(1.08);box-shadow:0 6px 14px #000b;z-index:35}
.bvh-agenda-event.dragging{opacity:.5}
.bvh-agenda-event .event-time{font-size:11px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bvh-agenda-event .event-client{font-size:12px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bvh-agenda-event .event-meta{display:block;font-size:10px;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bvh-agenda-event.annule{opacity:.55;text-decoration:line-through;border-style:dashed}
.bvh-agenda-legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #6d4b2266;background:#160e08;color:#c8a96f;font-size:12px}
.bvh-agenda-legend span{display:inline-flex;align-items:center;gap:5px}
.bvh-agenda-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bvh-agenda-empty{color:#9d7e49;text-align:center;padding:14px 16px;background:#130c07;border-bottom:1px solid #3b281366}
.bvh-agenda-conflict{margin-top:2px;padding:10px 12px;border-radius:8px;border:1px solid #9f7431;background:#5c3d1c33;color:#f3d58a;font-size:13px}
@media(max-width:760px){
  .bvh-calendar-toolbar{padding:12px}
  .bvh-calendar-title{width:100%;font-size:16px}
  .bvh-calendar-filter{min-width:100%;flex-basis:100%}
  .bvh-calendar-scroll{max-height:none}
  .bvh-week-grid{min-width:650px}
  .bvh-calendar-day-column{height:1632px}
  .bvh-agenda-event{font-size:11px}
}


/* ===== Tableau de bord — rendez-vous du jour ===== */
.bvh-today-agenda-row{
  display:grid;grid-template-columns:112px minmax(190px,1.45fr) minmax(170px,1fr) auto;
  gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366;
  background:linear-gradient(90deg,#160e08,#100a06);
}
.bvh-today-agenda-row:hover{background:linear-gradient(90deg,#24170c,#140d08)}
.bvh-today-agenda-time{font-weight:900;color:#f3d58a;border-left:4px solid var(--agenda-color,#c9943c);padding-left:9px;line-height:1.2}
.bvh-today-agenda-client{font-weight:900;color:#f5e4b8;display:block}
.bvh-today-agenda-sub{display:block;color:#b69b68;font-size:13px;margin-top:3px}
.bvh-today-agenda-responsable{display:flex;flex-direction:column;gap:6px;color:#d8bf82;font-size:13px}
.bvh-today-agenda-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.bvh-today-agenda-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #6d4b2266}
.bvh-today-agenda-head b{color:#f0ce80;text-transform:uppercase;letter-spacing:.06em}
.bvh-today-agenda-count{color:#b69b68;font-size:13px;margin-left:8px}
@media(max-width:760px){
  .bvh-today-agenda-head{align-items:flex-start;flex-direction:column}
  .bvh-today-agenda-row{grid-template-columns:1fr;gap:7px;padding:13px 14px}
  .bvh-today-agenda-time{width:max-content}
  .bvh-today-agenda-actions{justify-content:flex-start}
}


/* ===== Actions rapides depuis les fiches clients ===== */
.bvh-client-actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px;padding:13px 15px;border:1px solid #765326;border-radius:12px;background:linear-gradient(90deg,#24170c,#140d08);box-shadow:inset 0 0 0 1px #000}
.bvh-client-actions-title{width:100%;color:#f0ce80;font-weight:900;text-transform:uppercase;letter-spacing:.07em;font-size:12px;margin-bottom:1px}
.bvh-client-actions small{width:100%;color:#b69b68;font-size:13px;margin-top:-3px;margin-bottom:2px}
.bvh-client-actions button{min-height:42px}
.bvh-credit-row{display:grid;grid-template-columns:1.25fr 1fr 120px 120px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366}
.bvh-credit-row:first-of-type{border-top:none}
@media(max-width:760px){.bvh-client-actions{display:grid;grid-template-columns:1fr 1fr}.bvh-client-actions-title,.bvh-client-actions small{grid-column:1/-1}.bvh-client-actions button{width:100%}.bvh-credit-row{display:flex;flex-wrap:wrap;gap:7px;padding:13px 14px}.bvh-credit-row>*{flex:1 1 45%}}


/* ===== Tableau de bord : échéances à traiter ===== */
.bvh-due-row{
  grid-template-columns:minmax(150px,1fr) 92px 110px 110px 150px;
}
.bvh-due-loan-link{
  border:0;background:transparent;color:#f4d58b;font:inherit;font-weight:900;
  text-align:left;cursor:pointer;min-width:0;padding:0;line-height:1.12;
}
.bvh-due-loan-link:hover{color:#ffe19b;text-decoration:underline;transform:none;filter:none}
.bvh-due-loan-link small{
  display:block;margin-top:4px;color:#b69b68;font-size:11px;font-weight:800;
  text-decoration:none;
}
@media(max-width:760px){
  .bvh-due-row{display:flex}
  .bvh-due-loan-link{flex:1 1 52%;font-size:16px}
}


/* Tableau de bord : les échéances utilisent toute la largeur disponible */
.bvh-due-row{grid-template-columns:minmax(190px,1.35fr) 130px 145px 130px 170px}
@media(max-width:760px){.bvh-due-row{display:flex}}

async function call(url,opts={}){
  const {headers:customHeaders={},...rest}=opts;
  const r=await fetch(url,{
    credentials:'same-origin',
    cache:'no-store',
    headers:{
      'Content-Type':'application/json',
      'Cache-Control':'no-cache, no-store, max-age=0, must-revalidate',
      'Pragma':'no-cache',

  const txt=await r.text();

  try{data=txt?JSON.parse(txt):{};}catch{data={error:txt||'Réponse invalide'};}
  if(!r.ok) throw new Error(data.error||'Erreur serveur');

 login:(username,password)=>call('/api/login',{method:'POST',body:JSON.stringify({username,password})}), logout:()=>call('/api/logout',{method:'POST'}), me:()=>call('/api/me'),

};
function payment(capital,rate,n){capital=Number(capital);rate=Number(rate)/100;n=parseInt(n);if(!capital||!n)return 0;if(!rate)return capital/n;return capital*rate/(1-Math.pow(1+rate,-n));}
function schedule({capital,rate,n,start}){const p=payment(capital,rate,n); const e=[]; for(let i=0;i<n;i++){const d=new Date(start+'T12:00:00');d.setDate(d.getDate()+i*7);e.push({montant:Number(p.toFixed(2)),date:d.toISOString().split('T')[0],statut:'attente'});} return {echeances:e,total:Number((p*n).toFixed(2)),montant:Number(p.toFixed(2))};}

function localTimeNow(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function reminderDateTime(reminder){
  return new Date(`${reminder.reminder_date||'1970-01-01'}T${String(reminder.reminder_time||'00:00').slice(0,5)}:00`);
}

function LoansPage({loans,clients,setLoans,notify,onLoanDraftChange,openForClient,onQuickLoanHandled,openLoanId,onOpenLoanHandled,me,activeAgence='toutes',onActiveAgenceChange}){
  const[modal,setModal]=useState(false),[sel,setSel]=useState(null),[category,setCategory]=useState('tous'),[query,setQuery]=useState(''),[agency,setAgency]=useState(activeAgence||'toutes');
  useEffect(()=>{setAgency(activeAgence||'toutes')},[activeAgence]);
  useEffect(()=>{if(sel && !sel._edit){const live=loans.find(x=>String(x.id)===String(sel.id));if(live && live!==sel)setSel(live);}},[loans,sel]);
  useEffect(()=>{if(!openLoanId)return;const target=loans.find(x=>String(x.id)===String(openLoanId));if(target){setSel(target);onOpenLoanHandled?.();}},[openLoanId,loans]);
  useEffect(()=>()=>onLoanDraftChange?.(false),[]);
  useEffect(()=>{if(openForClient){onLoanDraftChange?.(true);setModal(true)}},[openForClient]);

  function unpaid(l){return [...(l.echeances||[])].filter(e=>e.statut!=='paye').sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));}
  function loanCategory(l){
    if(isLoanInRecouvrement(l))return 'recouvrement';
    const open=unpaid(l);
    if(open.length===0)return 'rembourses';
    if(open.some(e=>st(e)==='retard'))return 'retard';
    return st(open[0])==='aujourdhui'?'aujourdhui':'avenir';
  }
  function nextDue(l){return unpaid(l)[0]||null;}
  function paidAmount(l){return (l.echeances||[]).filter(e=>e.statut==='paye').reduce((sum,e)=>sum+Number(e.montant||0),0);}
  function sortLoans(a,b){
    const order={recouvrement:0,retard:1,aujourdhui:2,avenir:3,rembourses:4};
    const aCat=loanCategory(a),bCat=loanCategory(b);
    if(order[aCat]!==order[bCat])return order[aCat]-order[bCat];
    if(aCat==='rembourses'){
      const aLast=[...(a.echeances||[])].map(e=>e.date||'').sort().pop()||'';
      const bLast=[...(b.echeances||[])].map(e=>e.date||'').sort().pop()||'';
      return bLast.localeCompare(aLast);
    }
    return String(nextDue(a)?.date||'').localeCompare(String(nextDue(b)?.date||''));
  }

  const allLoans=[...(loans||[])].sort(sortLoans);
  const agencyLoans=allLoans.filter(l=>agency==='toutes'||loanAgence(l)===agency);
  const counts={
    tous:agencyLoans.length,
    recouvrement:agencyLoans.filter(l=>loanCategory(l)==='recouvrement').length,

const AGENDA_TIMES=Array.from({length:48},(_,i)=>`${String(Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`);

function agendaDateTime(date,time){return new Date(`${date}T${time||'00:00'}:00`);}
function agendaEndDate(date,start,end){return end<=start?plusDaysFrom(date,1):date;}
function plusDaysFrom(iso,days){const d=new Date(`${iso}T12:00:00`);d.setDate(d.getDate()+days);return d.toISOString().split('T')[0];}
function agendaDuration(event){
  const start=agendaDateTime(event.appointment_date,event.start_time);
  const end=agendaDateTime(event.end_date||event.appointment_date,event.end_time);
  const mins=Math.max(0,Math.round((end-start)/60000));
  if(!mins)return '—';
  const h=Math.floor(mins/60),m=mins%60;
  return h?(m?`${h} h ${m}`:`${h} h`):`${m} min`;
}
function agendaOverlapsSlot(event,day,time){
  const slotStart=agendaDateTime(day,time);
  const slotEnd=new Date(slotStart.getTime()+30*60000);
  const start=agendaDateTime(event.appointment_date,event.start_time);
  const end=agendaDateTime(event.end_date||event.appointment_date,event.end_time);
  return start<slotEnd && end>slotStart;
}
function agendaEventsForClient(client,events){

const AGENDA_SLOT_HEIGHT=34;
const AGENDA_COLORS={
  etude_pret:'#3f6f9f',
  signature:'#7a5a9e',
  remboursement:'#3f8f67',
  immobilier:'#9b6531',
  consultation:'#53788c',
  autre:'#776348'
};
function minutesFromTime(t){const [h,m]=String(t||'00:00').split(':').map(Number);return (h||0)*60+(m||0);}
function timeFromDate(d){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function isoFromDate(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);}
function mondayOf(iso){
  const d=new Date(`${iso}T12:00:00`);
  const shift=(d.getDay()+6)%7;
  d.setDate(d.getDate()-shift);
  return isoFromDate(d);
}
function weekDaysFrom(iso){const monday=mondayOf(iso);return Array.from({length:7},(_,i)=>plusDaysFrom(monday,i));}
function dateLong(iso){return new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function dateShort(iso){return new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function dayShort(iso){return new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');}
function sameDay(a,b){return String(a)===String(b);}
function agendaInterval(event){
  return {
    start:agendaDateTime(event.appointment_date,event.start_time),
    end:agendaDateTime(event.end_date||event.appointment_date,event.end_time)
  };
}
function eventsOverlap(a,b){
  const A=agendaInterval(a),B=agendaInterval(b);
  return A.start<B.end && A.end>B.start;
}
function segmentForDay(event,day){
  const startDay=agendaDateTime(day,'00:00');
  const endDay=agendaDateTime(plusDaysFrom(day,1),'00:00');
  const interval=agendaInterval(event);
  const start=interval.start>startDay?interval.start:startDay;
  const end=interval.end<endDay?interval.end:endDay;
  if(end<=start)return null;
  const top=((start-startDay)/60000/30)*AGENDA_SLOT_HEIGHT;
  const height=Math.max(28,((end-start)/60000/30)*AGENDA_SLOT_HEIGHT-2);
  return {...event,_segmentStart:start,_segmentEnd:end,_top:top,_height:height};
}
function layoutSegments(events,day){
  const segments=events.map(e=>segmentForDay(e,day)).filter(Boolean).sort((a,b)=>a._segmentStart-b._segmentStart);
  const final=[];
  let i=0;
  while(i<segments.length){
    const group=[segments[i]];
    let groupEnd=segments[i]._segmentEnd;
    let j=i+1;
    while(j<segments.length && segments[j]._segmentStart<groupEnd){
      group.push(segments[j]);
      if(segments[j]._segmentEnd>groupEnd)groupEnd=segments[j]._segmentEnd;
      j++;
    }
    const laneEnds=[];
    group.forEach(s=>{
      let lane=laneEnds.findIndex(end=>end<=s._segmentStart);
      if(lane<0){lane=laneEnds.length;laneEnds.push(s._segmentEnd);}
      else laneEnds[lane]=s._segmentEnd;
      s._lane=lane;
    });
    const laneCount=Math.max(1,laneEnds.length);
    group.forEach(s=>{s._laneCount=laneCount;final.push(s);});
    i=j;
  }
  return final;
}
function nextSlot(time){
  const index=AGENDA_TIMES.indexOf(time);
  return index===AGENDA_TIMES.length-1?'00:00':AGENDA_TIMES[Math.max(0,index+1)];
}

  return {appointment_date:day,start_time:time,end_time:nextSlot(time),appointment_type:'etude_pret',status:'prevu'};
}

  }
  async function dropEvent(day,time){
    if(!dragged)return;
    const source=dragged;
    setDragged(null);
    const before=agendaInterval(source);
    const duration=Math.max(30,Math.round((before.end-before.start)/60000));
    const nextStart=agendaDateTime(day,time);
    const nextEnd=new Date(nextStart.getTime()+duration*60000);
    try{
      await save({...source,appointment_date:day,start_time:time,end_date:isoFromDate(nextEnd),end_time:timeFromDate(nextEnd)});
      notify('Rendez-vous déplacé');
    }catch(e){}
  }
  const weekLabel=view==='week'
    ? `${dateShort(rangeStart)} — ${dateShort(rangeEnd)}`
    : dateLong(anchor);
  const activeCount=filteredEvents.filter(e=>e.status!=='annule').length;
  return <div>
    <div className="bvh-topbar">
      <div><small>Registre des rendez-vous</small><h1>Agenda partagé</h1><p style={{color:'#d8bc78',marginTop:4}}>Vue calendrier · 30 minutes · 24 heures sur 24 · relié aux dossiers clients</p></div>
      <Btn color="#8b642c" onClick={()=>openNew({appointment_date:anchor,start_time:'09:00',end_time:'09:30'})}>+ Nouveau rendez-vous</Btn>
    </div>
    <div className="bvh-calendar-panel">
      <div className="bvh-calendar-toolbar">
        <Btn color="#5f4725" onClick={()=>changePeriod(-1)}>←</Btn>
        <Btn color="#5f4725" onClick={()=>setAnchor(today())}>Aujourd’hui</Btn>
        <Btn color="#5f4725" onClick={()=>changePeriod(1)}>→</Btn>
        <Inp type="date" value={anchor} onChange={e=>setAnchor(e.target.value)} style={{width:165}}/>
        <span className="bvh-calendar-title">{weekLabel}</span>
        <div className="bvh-view-toggle">
          <button className={view==='week'?'active':''} onClick={()=>setView('week')}>Semaine</button>
          <button className={view==='day'?'active':''} onClick={()=>setView('day')}>Jour</button>
        </div>
        <span style={{color:'#b69b68',fontSize:13}}>{refreshing?'Actualisation…':`${activeCount} rendez-vous`}</span>
        <div className="bvh-calendar-filter"><Inp placeholder="Client, responsable, objet…" value={filter} onChange={e=>setFilter(e.target.value)}/></div>
        <Select label="" value={responsable} onChange={e=>setResponsable(e.target.value)}><option value="">Tous les responsables</option>{responsables.map(x=><option key={x} value={x}>{x}</option>)}</Select>
        <Select label="" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}><option value="">Tous les types</option>{Object.entries(AGENDA_TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Select>
      </div>
      <div className="bvh-agenda-legend">
        {Object.entries(AGENDA_TYPES).map(([k,label])=><span key={k}><i className="bvh-agenda-dot" style={{background:AGENDA_COLORS[k]}}></i>{label}</span>)}
        <span style={{marginLeft:'auto'}}>Glisse un bloc sur un autre créneau pour déplacer le rendez-vous.</span>
      </div>
      {filteredEvents.length===0&&<div className="bvh-agenda-empty">Aucun rendez-vous dans cette période avec les filtres actuels. Clique sur une case pour en créer un.</div>}
      <div className="bvh-calendar-scroll">
        <div className="bvh-week-grid" style={{'--days':days.length}}>
          <div className="bvh-calendar-corner"></div>
          {days.map(day=><div key={day} className={'bvh-calendar-day-head '+(sameDay(day,today())?'today':'')} onClick={()=>{setAnchor(day);setView('day')}} title="Ouvrir cette journée">
            <div className="dow">{dayShort(day)}</div><div className="date">{new Date(`${day}T12:00:00`).getDate()}</div>
          </div>)}
          <div>
            {AGENDA_TIMES.map((time,i)=><div className="bvh-calendar-time-label" key={time}>{i%2===0?time:''}</div>)}
          </div>
          {days.map(day=>{
            const segments=layoutSegments(filteredEvents,day);
            const now=new Date(nowTick);
            const isToday=sameDay(day,today());
            const nowTop=(now.getHours()*2+(now.getMinutes()/30))*AGENDA_SLOT_HEIGHT;
            return <div key={day} className="bvh-calendar-day-column">
              {AGENDA_TIMES.map(time=><div key={time} className="bvh-calendar-slot"
                onClick={()=>openNew(appointmentDraft(day,time))}
                onDragOver={e=>e.preventDefault()}
                onDrop={e=>{e.preventDefault();dropEvent(day,time);}}
                title={`${dateLong(day)} · ${time} — créer un rendez-vous`}
              />)}
              {isToday&&<div className="bvh-calendar-now" style={{top:nowTop}}></div>}
              {segments.map(e=>{
                const color=AGENDA_COLORS[e.appointment_type]||AGENDA_COLORS.autre;
                const left=`calc(${(e._lane/e._laneCount)*100}% + 3px)`;
                const width=`calc(${100/e._laneCount}% - 6px)`;
                const begins=e._segmentStart.getTime()===agendaDateTime(e.appointment_date,e.start_time).getTime();
                const endText=e._segmentEnd.getTime()===agendaDateTime(e.end_date||e.appointment_date,e.end_time).getTime()?e.end_time:'00:00';
                return <button key={`${e.id}-${day}`} draggable
                  className={'bvh-agenda-event '+(e.status==='annule'?'annule':'')}
                  onDragStart={ev=>{setDragged(e);ev.dataTransfer.effectAllowed='move';}}
                  onDragEnd={()=>setDragged(null)}
                  onClick={ev=>{ev.stopPropagation();openEdit(e)}}
                  title={`${e.client_prenom} ${e.client_nom}\n${e.title||AGENDA_TYPES[e.appointment_type]}\n${e.start_time} — ${e.end_time}\nResponsable : ${e.responsable_username||'—'}`}
                  style={{top:e._top+2,height:e._height,left,width,background:`linear-gradient(135deg,${color},${color}bb)`,borderLeftColor:'#f6dfaa',color:'#fff'}}>
                  {begins?<><span className="event-time">{e.start_time} – {endText}</span><span className="event-client">{e.client_prenom} {e.client_nom}</span><span className="event-meta">{e.title||AGENDA_TYPES[e.appointment_type]} · {e.responsable_username||'—'}</span></>:<><span className="event-client">↳ {e.client_prenom} {e.client_nom}</span><span className="event-meta">Suite jusqu’à {endText}</span></>}
                </button>
              })}
            </div>
          })}
        </div>
      </div>
    </div>
    <AgendaModal open={modal} event={editing} initial={draft} clients={clients} me={me} appointments={appointments} onClose={closeModal} onSave={save} onDelete={remove}/>
  </div>
}

function Check({label,checked,onChange}){return <label style={{display:'flex',gap:8,alignItems:'center',color:'#d8bf82',fontWeight:700}}><input type="checkbox" checked={!!checked} onChange={e=>onChange(e.target.checked)}/>{label}</label>}
function horseDiscord(f){const coupons=(f.numeros_coupons||'').split('\n').map(x=>x.trim()).filter(Boolean);const check=v=>v?'[x]':'[]';return `## DOSSIER DE CRÉDIT DE MISE HIPPIQUE ##\n\n**INFORMATIONS PERSONNELLES**\n        **Date du jour :** ${f.date_du_jour||'JJ/MM/AAAA'}\n        **Télégramme :** ${f.telegram||''}\n        **Adresse résidentielle actuelle :** ${f.adresse||''}\n        **Profession actuelle :** ${f.profession||''}\n\n**VÉRIFICATION D’IDENTITÉ**\n        ${check(f.identite_presentee)} Pièce d’identité valide présentée\n        ${check(f.photographie_ajoutee)} Photographie du client réalisée et ajoutée au dossier\n        **Lien pièce d’identité :** ${f.piece_identite_url||''}\n        **Lien photographie :** ${f.photographie_url||''}\n\n**DEMANDE DE CRÉDIT DE MISE**\n        **Montant total emprunté :** 25$ x ${f.coupons_count||1} = ${25*(Number(f.coupons_count)||1)}$\n        **Taux d’intérêt FIXE appliqué :** ${f.taux||0} %\n\n**INFORMATIONS SUR LE PARI HIPPIQUE**\n        **Date de la course :** ${f.date_course||'JJ/MM/AAAA'}\n        **Nom de l’écurie ou du cheval sélectionné :** ${f.cheval_ecurie||''}\n        **Type de pari envisagé :**\n        ${check(f.type_pari==='gagnant')} Gagnant\n        ${check(f.type_pari==='place')} Placé\n        ${check(f.type_pari==='couple')} Couplé\n        ${check(f.type_pari==='autre')} Autres : ${f.type_pari_autre||''}\n\n        **Bookmaker partenaire chargé de la prise de pari :** ${f.bookmaker||''}\n\n**COUPONS DE MISE**\n        **Numéros de série des coupons remis :**\n${coupons.length?coupons.map(x=>'        N°'+x).join('\n'):'        N°____'}\n\n        ${check(f.coupons_enregistres)} Coupons enregistrés dans le registre officiel\n        ${check(f.numeros_verifies)} Vérification des numéros de série effectuée\n\n**SITUATION FINANCIÈRE**\n        **Revenus mensuels estimés :** ${f.revenus_mensuels||''}\n        **Patrimoine déclaré :** ${f.patrimoine||''}\n        **Biens susceptibles de garantir le remboursement :** ${f.garanties||''}\n\n**RÉFÉRENCES**\n        **Êtes-vous recommandé par un employé, client ou partenaire de l’Hippodrome Howley & Co. ou de l'institution ?**\n        ${check(f.recommande)} Oui\n        ${check(!f.recommande)} Non\n\n        **Si oui, précisez le nom du référent :** ${f.referent||''}\n        **Autres recommandations :** ${f.recommandations||''}\n\n**DÉCLARATIONS ET ACCEPTATION**\n        ${check(f.a1)} Je reconnais que les coupons demeurent la propriété de la banque jusqu’à leur utilisation.\n        ${check(f.a2)} Je m’engage à rembourser immédiatement le financement accordé après la course hippique.\n        ${check(f.a3)} En cas de gains, j’accepte de rembourser le montant emprunté ainsi que les intérêts convenus.\n        ${check(f.a4)} J’accepte que mes biens personnels puisse être saisi en cas de défaut de paiement.\n        ${check(f.a5)} Je certifie l’exactitude des informations fournies.\n        ${check(f.a6)} J’accepte les conditions générales du service de crédit de mise hippique.\n\n*Le demandeur reconnaît qu’un crédit de mise hippique constitue un engagement financier immédiat et que tout défaut de remboursement pourra entraîner des mesures de recouvrement, des saisies patrimoniales, une procédure judiciaire fédérale ainsi que l’inscription dans les registres officiels des débiteurs insolvables.*\n\n*Par sa signature, le demandeur atteste avoir pris connaissance de l’ensemble des présentes conditions et les accepter sans réserve.*`}

function HorseCreditPage({clients,notify}){
  const empty={
    id:null,dossier_id:'',client_id:'',client_nom:'',client_prenom:'',telegram:'',adresse:'',profession:'',
    date_du_jour:new Date().toLocaleDateString('fr-FR'),
    identite_presentee:false,photographie_ajoutee:false,piece_identite_url:'',photographie_url:'',
    coupons_count:1,taux:0,date_course:'',cheval_ecurie:'',type_pari:'gagnant',type_pari_autre:'',
    bookmaker:'',numeros_coupons:'',coupons_enregistres:false,numeros_verifies:false,
    revenus_mensuels:'',patrimoine:'',garanties:'',recommande:false,referent:'',recommandations:'',
    a1:false,a2:false,a3:false,a4:false,a5:false,a6:false,statut:'en_cours'
  };
  const[f,setF]=useState(empty);
  const[credits,setCredits]=useState([]);
  const[busy,setBusy]=useState(false);
  const[view,setView]=useState(null);
  const[query,setQuery]=useState('');

  useEffect(()=>{api.horseCredits().then(setCredits).catch(e=>notify('⚠ '+e.message))},[]);

  function fromCredit(c){
    const acc=c.acceptations||{};
    return {
      ...empty,
      ...c,
      client_id:c.client_id||'',
      numeros_coupons:Array.isArray(c.numeros_coupons)?c.numeros_coupons.join('\n'):'',
      a1:!!acc.a1,a2:!!acc.a2,a3:!!acc.a3,a4:!!acc.a4,a5:!!acc.a5,a6:!!acc.a6,
      statut:c.statut||'en_cours'
    };
  }

  function payloadFromForm(){
    const discord=horseDiscord(f);
    return {
      ...f,
      numeros_coupons:String(f.numeros_coupons||'').split('\n').map(x=>x.trim()).filter(Boolean),
      acceptations:{a1:f.a1,a2:f.a2,a3:f.a3,a4:f.a4,a5:f.a5,a6:f.a6},
      discord_text:discord
    };
  }

  function resetForm(){setF(empty);setView(null);}
  function pick(id){const c=clients.find(x=>String(x.id)===String(id));setF({...f,client_id:id,client_nom:c?.nom||'',client_prenom:c?.prenom||'',telegram:c?.telegram||'',adresse:c?.adresse||''});}
  const discord=horseDiscord(f);

  async function copy(text=discord){await navigator.clipboard.writeText(text);notify('Formulaire Discord copié')}
  async function save(){
    try{
      setBusy(true);
      const payload=payloadFromForm();
      const r=payload.id?await api.updateHorseCredit(payload):await api.addHorseCredit(payload);
      setCredits(payload.id?credits.map(x=>x.id===r.id?r:x):[r,...credits]);
      setView(r);
      setF(fromCredit(r));
      notify(payload.id?'Crédit hippique modifié':'Crédit hippique enregistré');
    }catch(e){notify('⚠ '+e.message)}
    finally{setBusy(false)}
  }
  async function remove(c){
    if(!confirm(`Supprimer définitivement le dossier ${c.dossier_id} ?`))return;
    try{
      await api.deleteHorseCredit(c.id);
      setCredits(credits.filter(x=>x.id!==c.id));
      if(view?.id===c.id)setView(null);
      if(f.id===c.id)resetForm();
      notify('Crédit hippique supprimé');
    }catch(e){notify('⚠ '+e.message)}
  }
  function edit(c){setView(null);setF(fromCredit(c));window.scrollTo({top:0,behavior:'smooth'});}
  function show(c){setView(c);window.scrollTo({top:0,behavior:'smooth'});}
  function badgeStatus(s){
    const map={en_cours:['#8b642c','En cours'],termine:['#3f9b67','Terminé'],refuse:['#b94735','Refusé']};
    const v=map[s]||map.en_cours;
    return <span style={{background:v[0],color:'#fff',borderRadius:20,padding:'4px 10px',fontWeight:900,fontSize:12}}>{v[1]}</span>
  }

  const filtered=credits.filter(c=>`${c.dossier_id||''} ${c.client_prenom||''} ${c.client_nom||''} ${c.telegram||''}`.toLowerCase().includes(query.toLowerCase()));

  return <div>
    <div className="bvh-topbar">
      <div><small>Hippodrome Howley & Co.</small><h1>Crédit de mise hippique</h1></div>

        {f.id&&<Btn color="#555" onClick={resetForm}>Nouveau dossier</Btn>}
        <Btn color="#5f4725" onClick={()=>copy()}>📋 Copier Discord</Btn>
        <Btn color="#8b642c" disabled={busy} onClick={save}>{busy?'Enregistrement…':f.id?'Enregistrer les modifications':'Enregistrer'}</Btn>
      </div>
    </div>

    {view&&<div className="bvh-ledger" style={{marginBottom:14}}>
      <div className="bvh-ledger-title" style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'center'}}>
        <span>Dossier enregistré — {view.dossier_id}</span>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Btn color="#5f4725" onClick={()=>copy(view.discord_text||horseDiscord(fromCredit(view)))}>Copier Discord</Btn>
          <Btn color="#8b642c" onClick={()=>edit(view)}>Modifier</Btn>
          <Btn color={C.red} onClick={()=>remove(view)}>Supprimer</Btn>
          <Btn color="#555" onClick={()=>setView(null)}>Fermer</Btn>
        </div>
      </div>
      <div style={{padding:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>

          <div className="bvh-field"><b>Télégramme</b><span>{view.telegram||'—'}</span></div>
          <div className="bvh-field"><b>Adresse</b><span>{view.adresse||'—'}</span></div>
          <div className="bvh-field"><b>Profession</b><span>{view.profession||'—'}</span></div>
          <div className="bvh-field"><b>Montant</b><span>{fCur(view.montant_total)}</span></div>
          <div className="bvh-field"><b>Taux</b><span>{view.taux||0} %</span></div>
          <div className="bvh-field"><b>Statut</b><span>{badgeStatus(view.statut)}</span></div>
        </div>
        <div>

          <div className="bvh-field"><b>Type de pari</b><span>{view.type_pari||'—'} {view.type_pari_autre||''}</span></div>
          <div className="bvh-field"><b>Bookmaker</b><span>{view.bookmaker||'—'}</span></div>
          <div className="bvh-field"><b>Pièce d'identité</b><span>{view.piece_identite_url?<a href={view.piece_identite_url} target="_blank" rel="noreferrer" style={{color:'#f3d58a'}}>Consulter</a>:'—'}</span></div>

        </div>

      <pre style={{whiteSpace:'pre-wrap',padding:16,color:'#f0d899',fontSize:13,lineHeight:1.45,maxHeight:360,overflow:'auto',borderTop:'1px solid #6d4b2266'}}>{view.discord_text||horseDiscord(fromCredit(view))}</pre>
    </div>}

    <div className="bvh-dossier-grid-wide">

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}><Inp label="Prénom" value={f.client_prenom} onChange={e=>setF({...f,client_prenom:e.target.value})}/><Inp label="Nom" value={f.client_nom} onChange={e=>setF({...f,client_nom:e.target.value})}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}><Inp label="Date du jour" value={f.date_du_jour} onChange={e=>setF({...f,date_du_jour:e.target.value})}/><Inp label="Télégramme" value={f.telegram} onChange={e=>setF({...f,telegram:e.target.value})}/></div>
          <Inp label="Adresse résidentielle actuelle" value={f.adresse} onChange={e=>setF({...f,adresse:e.target.value})}/>
          <Inp label="Profession actuelle" value={f.profession} onChange={e=>setF({...f,profession:e.target.value})}/>

          <Sec>Vérification d'identité</Sec>
          <Check label="Pièce d’identité valide présentée" checked={f.identite_presentee} onChange={v=>setF({...f,identite_presentee:v})}/>

          <Inp label="Date de la course" value={f.date_course} onChange={e=>setF({...f,date_course:e.target.value})}/>
          <Inp label="Écurie ou cheval" value={f.cheval_ecurie} onChange={e=>setF({...f,cheval_ecurie:e.target.value})}/>

          {f.type_pari==='autre'&&<Inp label="Autre type de pari" value={f.type_pari_autre} onChange={e=>setF({...f,type_pari_autre:e.target.value})}/>}
          <Inp label="Bookmaker partenaire" value={f.bookmaker} onChange={e=>setF({...f,bookmaker:e.target.value})}/>
          <Txt label="Numéros de série des coupons — un par ligne" value={f.numeros_coupons} onChange={e=>setF({...f,numeros_coupons:e.target.value})}/>
          <Check label="Coupons enregistrés dans le registre officiel" checked={f.coupons_enregistres} onChange={v=>setF({...f,coupons_enregistres:v})}/>
          <Check label="Vérification des numéros de série effectuée" checked={f.numeros_verifies} onChange={v=>setF({...f,numeros_verifies:v})}/>

          <Sec>Situation financière et références</Sec>
          <Inp label="Revenus mensuels estimés" value={f.revenus_mensuels} onChange={e=>setF({...f,revenus_mensuels:e.target.value})}/>
          <Inp label="Patrimoine déclaré" value={f.patrimoine} onChange={e=>setF({...f,patrimoine:e.target.value})}/>
          <Inp label="Biens en garantie" value={f.garanties} onChange={e=>setF({...f,garanties:e.target.value})}/>
          <Check label="Recommandé par un employé/client/partenaire" checked={f.recommande} onChange={v=>setF({...f,recommande:v})}/>
          <Inp label="Nom du référent" value={f.referent} onChange={e=>setF({...f,referent:e.target.value})}/>
          <Txt label="Autres recommandations" value={f.recommandations} onChange={e=>setF({...f,recommandations:e.target.value})}/>

          <Sec>Déclarations</Sec>

            ['a1','Coupons propriété de la banque jusqu’à utilisation'],
            ['a2','Remboursement immédiat après la course'],
            ['a3','Remboursement du montant et intérêts en cas de gains'],
            ['a4','Saisie possible des biens en cas de défaut'],
            ['a5','Exactitude des informations certifiée'],
            ['a6','Conditions générales acceptées']
          ].map(x=><Check key={x[0]} label={x[1]} checked={f[x[0]]} onChange={v=>setF({...f,[x[0]]:v})}/>)}
          <Select label="Statut du dossier" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}><option value="en_cours">En cours</option><option value="termine">Terminé</option><option value="refuse">Refusé</option></Select>
        </div>
      </div>

      <div className="bvh-ledger">
        <div className="bvh-ledger-title">Aperçu Discord</div>
        <pre style={{whiteSpace:'pre-wrap',padding:16,color:'#f0d899',fontSize:13,lineHeight:1.45,maxHeight:620,overflow:'auto'}}>{discord}</pre>
      </div>
    </div>

    <div className="bvh-ledger" style={{marginTop:14}}>
      <div className="bvh-ledger-title" style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'center'}}>
        <span>Crédits hippiques enregistrés</span>
        <input placeholder="Rechercher un dossier..." value={query} onChange={e=>setQuery(e.target.value)} style={{background:'#120b06',border:'1px solid #62451f',borderRadius:8,padding:'8px 10px',color:'#f8e7b7',minWidth:260}}/>
      </div>
      {filtered.length===0?<p className="bvh-empty">Aucun crédit hippique enregistré.</p>:filtered.map(c=><div className="bvh-row" key={c.id} style={{gridTemplateColumns:'1.2fr 1.2fr 100px 95px 250px'}}>
        <b>{c.dossier_id}</b>
        <span>{c.client_prenom} {c.client_nom}</span>
        <span>{fCur(c.montant_total)}</span>
        <span>{badgeStatus(c.statut)}</span>
        <span style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <Btn color="#555" onClick={()=>show(c)}>Voir</Btn>
          <Btn color="#8b642c" onClick={()=>edit(c)}>Modifier</Btn>
          <Btn color={C.red} onClick={()=>remove(c)}>Supprimer</Btn>
        </span>
      </div>)}
    </div>
  </div>
}

function appointmentTouchesDate(event,date){
  const start=agendaDateTime(event.appointment_date,event.start_time);
  const end=agendaDateTime(event.end_date||event.appointment_date,event.end_time);
  const dayStart=agendaDateTime(date,'00:00');
  const dayEnd=agendaDateTime(plusDaysFrom(date,1),'00:00');
  return start<dayEnd && end>dayStart;
}
function dashboardAppointmentTime(event,date){
  const begins=String(event.appointment_date)===String(date)?event.start_time:'00:00';
  const ends=String(event.end_date||event.appointment_date)===String(date)?event.end_time:'00:00';
  return `${begins} — ${ends}`;
}
function TodayAppointments({appointments=[],onOpenAgenda,onOpenClient}){
  const currentDate=today();
  const events=(appointments||[])
    .filter(e=>appointmentTouchesDate(e,currentDate))
    .sort((a,b)=>agendaInterval(a).start-agendaInterval(b).start);
  return <div className="bvh-ledger" style={{marginBottom:14}}>
    <div className="bvh-today-agenda-head">
      <div><b>Rendez-vous du jour</b><span className="bvh-today-agenda-count">{events.length} prévu{events.length===1?'':'s'} · {fDate(currentDate)}</span></div>
      <Btn color="#5f4725" onClick={onOpenAgenda}>Ouvrir l’agenda</Btn>
    </div>
    {events.length===0?<p className="bvh-empty">Aucun rendez-vous prévu aujourd’hui.</p>:events.map(event=>{
      const color=AGENDA_COLORS[event.appointment_type]||'#8b642c';
      const type=AGENDA_TYPES[event.appointment_type]||event.appointment_type||'Rendez-vous';
      return <div className="bvh-today-agenda-row" key={event.id} style={{'--agenda-color':color}}>
        <div className="bvh-today-agenda-time">{dashboardAppointmentTime(event,currentDate)}</div>
        <div><span className="bvh-today-agenda-client">{event.client_prenom} {event.client_nom}</span><span className="bvh-today-agenda-sub">{type}{event.title?` · ${event.title}`:''}</span></div>
        <div className="bvh-today-agenda-responsable"><AgendaStatus status={event.status}/><span>Responsable : {event.responsable_username||'—'}</span></div>
        <div className="bvh-today-agenda-actions"><Btn color="#5f4725" onClick={()=>onOpenClient(event.client_id)}>Dossier</Btn><Btn color={color} onClick={onOpenAgenda}>Agenda</Btn></div>
      </div>
    })}
  </div>
}
function Dashboard({loans,clients,logs,me,onMark,onLoanUpdate,appointments=[],onOpenAgenda,onOpenClient,onOpenLoan,notify}){
  const[reminderTarget,setReminderTarget]=useState(null);
  const upcoming=[];
  loans.forEach(l=>(l.echeances||[]).forEach((e,i)=>{if(e.statut!=='paye'){const d=daysDiff(e.date);if(d<=7)upcoming.push({...e,loan:l,i,d});}}));
  upcoming.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const total7=upcoming.reduce((s,e)=>s+Number(e.montant),0);
  const capitalPrete=loans.reduce((s,l)=>s+Number(l.somme||0),0);
  const totalAttendu=loans.reduce((s,l)=>s+Number(l.total_a_rembourser||0),0);
  const encaisse=loans.reduce((s,l)=>s+(l.echeances||[]).filter(e=>e.statut==='paye').reduce((a,e)=>a+Number(e.montant||0),0),0);
  const restant=Math.max(totalAttendu-encaisse,0);
  const recouvrements=loans.filter(l=>isLoanInRecouvrement(l)).length;
  const retards=upcoming.filter(e=>e.d<0&&!isLoanInRecouvrement(e.loan)).length;
  const derniers=(logs||[]).slice(0,5);
  function savedReminder(updatedLoan){onLoanUpdate?.(updatedLoan);notify?.('Rappel enregistré dans le registre');}
  return <div>
    <div className="bvh-topbar"><div><small>Système interne sécurisé</small><h1>Tableau de bord</h1></div><div style={{textAlign:'right',color:'#d8bc78'}}><b>{date1904()}</b><br/><span>{me?.username} — {roles[me?.role]}</span></div></div>
    <div className="bvh-grid-4"><InfoCard icon="🏛️" title="Capital prêté" value={fCur(capitalPrete)} note="Montant nominal accordé"/><InfoCard icon="💰" title="Capital à récupérer" value={fCur(restant)} note="Reste à encaisser"/><InfoCard icon="📜" title="Prêts actifs" value={loans.length} note={`${clients.length} clients enregistrés`}/><InfoCard icon="⚠️" title="Retards" value={retards} note="Hors dossiers en recouvrement"/></div>
    <div className="bvh-grid-4"><InfoCard icon="📆" title="À encaisser 7 jours" value={fCur(total7)} note="Prochaines échéances"/><InfoCard icon="✅" title="Déjà encaissé" value={fCur(encaisse)} note="Paiements validés"/><InfoCard icon="📚" title="Dossiers clients" value={clients.length} note="Registre clientèle"/><InfoCard icon="⚖️" title="Recouvrement" value={recouvrements} note="Dossiers suivis séparément"/></div>
    <div className="bvh-ledger" style={{marginBottom:14}}><div className="bvh-ledger-title">Dernières opérations</div>{derniers.length===0?<p className="bvh-empty">Aucune opération récente.</p>:derniers.map(l=><div className="bvh-activity" key={l.id}><b>{l.username}</b><br/><span>{l.action}</span><br/><small style={{color:'#9f8550'}}>{new Date(l.created_at).toLocaleString('fr-FR')}</small></div>)}</div>
    <TodayAppointments appointments={appointments} onOpenAgenda={onOpenAgenda} onOpenClient={onOpenClient}/>
    <div className="bvh-ledger"><div className="bvh-ledger-title">Échéances à traiter</div>{upcoming.length===0?<p className="bvh-empty">Aucune échéance.</p>:upcoming.map((e,i)=>{const last=latestReminder(e);return <div className="bvh-row bvh-due-row bvh-due-row-reminder" key={i}>
      <button className="bvh-due-loan-link" onClick={()=>onOpenLoan?.(e.loan.id)} title="Ouvrir la fiche détaillée du prêt">{e.loan.prenom} {e.loan.nom}<small>↗ Voir le prêt{last?` · ${reminderSummary(last)}`:' · Aucun rappel noté'}</small></button>
      <span>{fCur(e.montant)}</span><span>{fDate(e.date)}</span><Badge s={st(e)}/><span className="bvh-due-actions"><Btn color="#8b642c" onClick={()=>setReminderTarget(e)}>Rappel</Btn><Btn color={C.green} onClick={()=>onMark(e.loan,e.i,true)}>Valider paiement</Btn></span>
    </div>})}</div>
    <ReminderModal open={!!reminderTarget} loan={reminderTarget?.loan} echeance={reminderTarget} echeanceIndex={reminderTarget?.i} onClose={()=>setReminderTarget(null)} onSaved={savedReminder} me={me}/>
  </div>
}
function InfoCard({icon,title,value,note}){return <div className="bvh-card"><div className="icon">{icon}</div><p>{title}</p><h2>{value}</h2><small style={{color:'#8f7547'}}>{note}</small></div>}
function Card({title,value,icon,color}){return <InfoCard icon={icon} title={title} value={value} note=""/>}
function EcheancesTable({items,onMark}){return <div className="bvh-ledger">{items.length===0?<p className="bvh-empty">Aucune échéance.</p>:items.map((e,i)=><div key={i} className="bvh-row"><b>{e.loan.prenom} {e.loan.nom}</b><span>{fCur(e.montant)}</span><span>{fDate(e.date)}</span><Badge s={st(e)}/><Btn color={C.green} onClick={()=>onMark(e.loan,e.i,true)}>Valider paiement</Btn></div>)}</div>}
function LogsPage({logs}){return <div><h1 style={{marginBottom:18}}>Logs</h1><div style={{display:'grid',gap:8}}>{logs.map(l=><div key={l.id} style={{background:C.card,border:'1px solid '+C.bord,borderRadius:10,padding:12}}><b>{new Date(l.created_at).toLocaleString('fr-FR')} — {l.username}</b><p style={{color:C.gold}}>{l.action}</p><pre style={{whiteSpace:'pre-wrap',color:C.muted,fontSize:12}}>{JSON.stringify(l.details||{},null,2)}</pre></div>)}</div></div>}

function App(){
  const[me,setMe]=useState(null),[loading,setLoading]=useState(true),[page,setPage]=useState('dashboard'),[toast,setToast]=useState(''),[loans,setLoans]=useState([]),[clients,setClients]=useState([]),[appointments,setAppointments]=useState([]),[applications,setApplications]=useState([]),[users,setUsers]=useState([]),[logs,setLogs]=useState([]),[menuOpen,setMenuOpen]=useState(false),[refreshing,setRefreshing]=useState(false),[loanDraftActive,setLoanDraftActive]=useState(false),[clientFocus,setClientFocus]=useState(null),[loanPrefill,setLoanPrefill]=useState(null),[loanFocus,setLoanFocus]=useState(null),[agendaPrefill,setAgendaPrefill]=useState(null),[activeAgence,setActiveAgence]=useState('toutes');
  const notify=m=>{setToast(m);setTimeout(()=>setToast(''),3000)};
  async function loadAll(user){
    const req=[api.loans(),api.clients(),api.agenda(),api.creditApplications()];
    if(roleRank[user.role]>=2) req.push(api.users());
    if(roleRank[user.role]>=2) req.push(api.logs());
    const r=await Promise.allSettled(req);
    setLoans(r[0].status==='fulfilled'?r[0].value:[]);
    setClients(r[1].status==='fulfilled'?r[1].value:[]);
    setAppointments(r[2].status==='fulfilled'?r[2].value:[]);
    setApplications(r[3].status==='fulfilled'?r[3].value:[]);
    let i=4;
    if(roleRank[user.role]>=2 && r[i]?.status==='fulfilled')setUsers(r[i].value);
    if(roleRank[user.role]>=2 && r[i+1]?.status==='fulfilled')setLogs(r[i+1].value);
  }
  useEffect(()=>{(async()=>{try{const r=await api.me();setMe(r.user);await loadAll(r.user);}catch{}finally{setLoading(false)}})()},[]);

  useEffect(()=>{
    if(!me || !['dashboard','prets'].includes(page) || loanDraftActive) return;
    let active=true;
    const syncLoans=async()=>{
      if(document.visibilityState!=='visible') return;
      try{
        const latest=await api.loans();
        if(active) setLoans(latest||[]);
      }catch{}
    };
    syncLoans();
    const timer=window.setInterval(syncLoans,8000);
    const onVisibility=()=>{if(document.visibilityState==='visible')syncLoans();};
    document.addEventListener('visibilitychange',onVisibility);
    return ()=>{active=false;window.clearInterval(timer);document.removeEventListener('visibilitychange',onVisibility);};
  },[me,page,loanDraftActive]);



  useEffect(()=>{
    if(!me || page!=='dashboard') return;
    let active=true;
    const syncAppointments=async()=>{
      if(document.visibilityState!=='visible')return;
      try{const latest=await api.agenda();if(active)setAppointments(latest||[]);}catch{}
    };
    syncAppointments();
    const timer=window.setInterval(syncAppointments,10000);
    const onVisibility=()=>{if(document.visibilityState==='visible')syncAppointments();};
    document.addEventListener('visibilitychange',onVisibility);
    return()=>{active=false;window.clearInterval(timer);document.removeEventListener('visibilitychange',onVisibility);};
  },[me,page]);

  async function onLogin(user){setMe(user);await loadAll(user)}
  async function logout(){await api.logout();setMe(null)}
  async function mark(loan,i,val){const es=[...(loan.echeances||[])];es[i]={...es[i],statut:val?'paye':'attente'};try{const u=await api.updateLoan({id:loan.id,echeances:es});setLoans(loans.map(x=>x.id===u.id?u:x));notify(val?'Paiement validé':'Paiement annulé')}catch(e){notify('⚠ '+e.message)}}
  if(loading)return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>Chargement…</div>;
  if(!me)return <Login onLogin={onLogin}/>;
  const menu=[['dashboard','🏛️','Tableau'],['prets','📜','Prêts'],['clients','👤','Clients'],['agenda','🗓️','Agenda'],['hippique','🏇','Crédit hippique']];
  if(roleRank[me.role]>=2) menu.push(['users','🔐','Comptes'],['logs','📖','Journal']);
  async function refreshSharedData(){
    if(!me) return;
    setRefreshing(true);
    try{
      await loadAll(me);
    }finally{
      setRefreshing(false);
    }
  }
  function choosePage(target){
    setPage(target);
    setMenuOpen(false);
    refreshSharedData();
  }
  function openClientDossier(clientId){
    if(!clientId)return;
    setClientFocus(clientId);
    choosePage('clients');
  }
  function openQuickLoan(client){
    setLoanPrefill(client);
    choosePage('prets');
  }
  function openLoanDetails(loanId){
    if(!loanId)return;
    setLoanFocus(loanId);
    choosePage('prets');
  }
  function openQuickAppointment(client){
    setAgendaPrefill(client);
    choosePage('agenda');
  }
  const loansForActiveBank=loans.filter(l=>activeAgence==='toutes'||loanAgence(l)===activeAgence);
  return <div className="bvh-shell"><Toast msg={toast}/>
    <div className="bvh-mobile-top">
      <button className="bvh-mobile-menu-button" aria-label="Ouvrir le menu" onClick={()=>setMenuOpen(!menuOpen)}>{menuOpen?'✕':'☰'}</button>
      <div className="bvh-mobile-title"><b>Banque Van Horn</b><span>Établie en 1904 · {roles[me.role]}</span></div>
    </div>
    <div className={'bvh-menu-backdrop '+(menuOpen?'open':'')} onClick={()=>setMenuOpen(false)}></div>
    <aside className={'bvh-sidebar '+(menuOpen?'open':'')}>
      <div className="bvh-brand"><img src="/logo-vh.png" alt="Banque Van Horn"/><div className="bvh-brand-title">Banque Van Horn</div><div className="bvh-brand-date">Établie en 1904</div></div>
      <nav className="bvh-nav">{menu.map(m=><button key={m[0]} className={page===m[0]?'active':''} onClick={()=>choosePage(m[0])}>{m[1]} {m[2]}</button>)}</nav>
      <div style={{borderTop:'1px solid #6d4b2266',paddingTop:12,marginTop:14}}>
        <Select label="Banque active" value={activeAgence} onChange={e=>setActiveAgence(e.target.value)}>
          <option value="toutes">Toutes les banques</option>
          <option value="van_horn">Van Horn</option>
          <option value="saint_denis">Saint-Denis</option>
        </Select>
      </div>
      <div className="bvh-user"><small style={{color:'#9f8550',textTransform:'uppercase',letterSpacing:'.12em'}}>Connecté</small><br/><b>{me.username}</b><p style={{color:'#d0b272',fontSize:13}}>{roles[me.role]}</p><Btn full color="#5f4725" onClick={logout} style={{marginTop:12}}>Déconnexion</Btn></div>
    </aside>
    <main className="bvh-main">
      {refreshing&&<div style={{position:'fixed',right:18,top:18,zIndex:998,background:'#25170c',border:'1px solid #c9943c',color:'#f3d58a',borderRadius:8,padding:'8px 12px',fontWeight:800,fontSize:13,boxShadow:'0 8px 24px #0008'}}>Actualisation des données…</div>}
      {page==='dashboard'&&<Dashboard loans={loansForActiveBank} clients={clients} logs={logs} me={me} onMark={mark} onLoanUpdate={u=>setLoans(loans.map(x=>x.id===u.id?u:x))} appointments={appointments} onOpenAgenda={()=>choosePage('agenda')} onOpenClient={openClientDossier} onOpenLoan={openLoanDetails} notify={notify}/>} {page==='prets'&&<LoansPage loans={loans} clients={clients} setLoans={setLoans} notify={notify} onLoanDraftChange={setLoanDraftActive} openForClient={loanPrefill} onQuickLoanHandled={()=>setLoanPrefill(null)} openLoanId={loanFocus} onOpenLoanHandled={()=>setLoanFocus(null)} me={me} activeAgence={activeAgence} onActiveAgenceChange={setActiveAgence}/>} {page==='clients'&&<ClientsPage clients={clients} setClients={setClients} loans={loans} appointments={appointments} applications={applications} setApplications={setApplications} notify={notify} openClientId={clientFocus} onOpenClientHandled={()=>setClientFocus(null)} onQuickLoan={openQuickLoan} onQuickAppointment={openQuickAppointment}/>} {page==='agenda'&&<AgendaPage appointments={appointments} setAppointments={setAppointments} clients={clients} me={me} notify={notify} openForClient={agendaPrefill} onQuickAppointmentHandled={()=>setAgendaPrefill(null)}/>} {page==='hippique'&&<HorseCreditPage clients={clients} notify={notify}/>} {page==='users'&&<UserPanel me={me} users={users} setUsers={setUsers} notify={notify}/>} {page==='logs'&&<LogsPage logs={logs}/>}
    </main>
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
