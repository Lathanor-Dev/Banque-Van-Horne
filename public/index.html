<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banque Van Horn</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0905; --panel:#17100a; --panel2:#20150d; --ink:#f5e4b8;
  --muted:#b69b68; --gold:#c9943c; --gold2:#f3d58a; --line:#62451f;
  --blue:#4d8fbd; --green:#3f9b67; --red:#b94735; --black:#070503;
}
body{
  font-family: Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at top,#28190e 0%,#100a06 38%,#070503 100%);
  color:var(--ink);
}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0b0704}
::-webkit-scrollbar-thumb{background:#8b642c;border-radius:8px}
h1,h2,h3{letter-spacing:.02em;text-shadow:0 2px 0 #000}
button{transition:.15s ease}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.bvh-sidebar{
  width:255px;background:linear-gradient(180deg,#1b1108,#0d0905);
  border-right:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;
  box-shadow:8px 0 28px #0008;position:relative;
}
.bvh-sidebar:after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:#d09c4a55}
.bvh-brand{text-align:center;padding:8px 0 18px;margin-bottom:18px;border-bottom:1px solid #6d4b2266}
.bvh-brand img{width:128px;max-width:90%;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 16px #000)}
.bvh-brand-title{font-size:27px;line-height:1.02;font-weight:900;color:#f6d27b;text-transform:uppercase;letter-spacing:.045em}
.bvh-brand-date{margin-top:8px;color:#d9b66c;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.bvh-main{flex:1;padding:26px 34px;overflow:auto;background:linear-gradient(180deg,#130d08aa,#090603aa)}
.bvh-nav{display:grid;gap:9px;flex:1}
.bvh-nav button{
  border:1px solid #4a321966;border-radius:9px;padding:13px 14px;text-align:left;
  font-weight:800;cursor:pointer;color:#cfb57b;background:#120b06;
  box-shadow:inset 0 0 0 1px #0008;
}
.bvh-nav button.active{
  color:#ffe19b;background:linear-gradient(90deg,#4a3216,#2a1a0c);
  border-color:#9f7431;box-shadow:0 0 18px #c9943c22,inset 0 0 0 1px #e0b45a33;
}
.bvh-user{border-top:1px solid #6d4b2266;padding-top:16px;color:#f1d99a}
.bvh-topbar{
  border:1px solid #6d4b22;border-radius:12px;margin-bottom:22px;padding:16px 20px;
  background:linear-gradient(90deg,#25170c,#191007);display:flex;justify-content:space-between;gap:16px;align-items:center;
  box-shadow:inset 0 0 0 1px #000,0 8px 24px #0005;
}
.bvh-topbar small{display:block;color:#c9a567;letter-spacing:.13em;text-transform:uppercase}
.bvh-card{
  background:linear-gradient(180deg,#1d130b,#130c07);border:1px solid #6d4b22;border-radius:14px;
  padding:18px;box-shadow:inset 0 0 0 1px #000,0 12px 28px #0005;position:relative;overflow:hidden;
}
.bvh-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.bvh-card .icon{font-size:27px;margin-bottom:7px}
.bvh-card p{color:#c6aa72;font-size:14px}
.bvh-card h2{font-size:30px;color:#f4c86d;margin-top:4px}
.bvh-grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.bvh-grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
.bvh-ledger{background:linear-gradient(180deg,#1b1109,#100a06);border:1px solid #6d4b22;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.bvh-ledger-title{padding:14px 16px;border-bottom:1px solid #6d4b2266;color:#f0ce80;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.bvh-row{display:grid;grid-template-columns:1.4fr 110px 110px 110px 155px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366}
.bvh-row:first-of-type{border-top:none}
.bvh-empty{padding:28px;text-align:center;color:#d7bc7b}
.bvh-activity{padding:12px 16px;border-top:1px solid #3b281366;color:#d8bf82}
.bvh-activity b{color:#f4d58b}
.bvh-login-logo{width:185px;max-width:90%;display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 16px #000)}
.bvh-login-card{background:linear-gradient(180deg,#1e140b,#100a06);border:1px solid #805a28;border-top:4px solid #c9943c;border-radius:18px;padding:34px;width:420px;box-shadow:0 32px 90px #000}

.bvh-client-list{display:grid;gap:10px;margin-top:16px}
.bvh-client-row{display:grid;grid-template-columns:150px 1.5fr 120px 140px 150px;gap:12px;align-items:center;background:linear-gradient(180deg,#1b1109,#100a06);border:1px solid #6d4b22;border-radius:10px;padding:13px 15px;box-shadow:inset 0 0 0 1px #000;cursor:pointer}
.bvh-client-row:hover{border-color:#c9943c;box-shadow:0 0 18px #c9943c22,inset 0 0 0 1px #000}
.bvh-dossier-head{border:1px solid #7b5528;border-radius:14px;padding:18px 20px;background:linear-gradient(90deg,#28190d,#140c06);display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}
.bvh-dossier-code{color:#f3d58a;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.bvh-dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bvh-field{display:grid;grid-template-columns:150px 1fr;padding:9px 0;border-bottom:1px solid #3b281366;color:#d8bf82}
.bvh-field b{color:#f4d58b}
.bvh-note-box{min-height:140px;border:1px dashed #7b5528;border-radius:10px;padding:14px;color:#b69b68;background:#100a06}

.bvh-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:16px}
.bvh-doc-card{border:1px solid #65451f;border-radius:12px;background:linear-gradient(180deg,#21160d,#120b06);padding:12px;display:flex;gap:12px;align-items:center;min-height:92px;box-shadow:inset 0 0 0 1px #0007}
.bvh-doc-thumb{width:62px;height:62px;border-radius:8px;object-fit:cover;border:1px solid #7b5528;background:#0b0704;display:flex;align-items:center;justify-content:center;font-size:28px;color:#f3d58a;flex:0 0 auto}
.bvh-doc-meta{min-width:0;flex:1;color:#d8bf82;font-size:13px}
.bvh-doc-meta b{display:block;color:#f4d58b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.bvh-doc-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bvh-upload-line{padding:14px 16px;border-top:1px solid #4a321966;display:grid;grid-template-columns:160px 1fr auto;gap:10px;align-items:end}
.bvh-dossier-grid-wide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1100px){.bvh-upload-line{grid-template-columns:1fr}.bvh-dossier-grid-wide{grid-template-columns:1fr}}

@media(max-width:900px){.bvh-client-row{grid-template-columns:1fr}.bvh-dossier-grid{grid-template-columns:1fr}}

@media(max-width:1100px){.bvh-grid-4{grid-template-columns:repeat(2,1fr)}.bvh-grid-2{grid-template-columns:1fr}.bvh-sidebar{width:230px}}

.bvh-note-input{width:100%;background:#120b06;border:1px solid #62451f;border-radius:8px;color:#f8e7b7;padding:12px;font-family:Georgia,serif;font-size:15px;outline:none}
.bvh-note-card{background:linear-gradient(180deg,#f3dfad,#d8b66f);color:#1b1008;border:1px solid #8b642c;border-radius:8px;padding:12px;box-shadow:inset 0 0 18px #5b351033}
.bvh-note-card small{color:#5b3510;font-weight:800}


/* ===== Adaptation téléphone et tablette ===== */
.bvh-mobile-top,.bvh-menu-backdrop{display:none}
.bvh-shell{display:flex;min-height:100vh}

@media (max-width:1100px) and (min-width:761px){
  .bvh-sidebar{width:214px;padding-left:14px;padding-right:14px}
  .bvh-main{padding:22px}
  .bvh-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bvh-grid-2,.bvh-dossier-grid-wide{grid-template-columns:1fr}
}

@media (max-width:760px){
  html,body,#root{min-height:100%;overflow-x:hidden}
  body{font-size:16px}
  .bvh-shell{display:block;min-height:100dvh}
  .bvh-mobile-top{
    display:flex;position:fixed;z-index:250;left:0;right:0;top:0;height:60px;
    align-items:center;gap:11px;padding:8px 12px;
    background:linear-gradient(90deg,#1d120a,#0d0905);border-bottom:1px solid #6d4b22;
    box-shadow:0 6px 18px #0009;
  }
  .bvh-mobile-menu-button{
    width:42px;height:42px;border-radius:9px;border:1px solid #8b642c;
    background:linear-gradient(180deg,#5c3d1c,#2e1b0d);color:#ffe0a0;font-size:21px;cursor:pointer;
  }
  .bvh-mobile-title{min-width:0;line-height:1.05}
  .bvh-mobile-title b{display:block;color:#f6d27b;font-size:16px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bvh-mobile-title span{display:block;color:#c5a261;font-size:10px;text-transform:uppercase;letter-spacing:.16em;margin-top:3px}
  .bvh-menu-backdrop{position:fixed;z-index:240;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .bvh-menu-backdrop.open{display:block;opacity:1;pointer-events:auto}
  .bvh-sidebar{
    position:fixed;z-index:260;top:0;left:0;bottom:0;height:100dvh;width:min(84vw,310px);
    transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;
    padding-top:13px;box-shadow:14px 0 35px #000c;
  }
  .bvh-sidebar.open{transform:translateX(0)}
  .bvh-brand{padding-top:8px;margin-bottom:12px}
  .bvh-brand img{width:155px;max-width:74%;margin-bottom:8px}
  .bvh-brand-title{font-size:24px}
  .bvh-nav{flex:none}
  .bvh-nav button{min-height:48px;font-size:16px}
  .bvh-user{margin-top:16px}
  .bvh-main{width:100%;min-height:100dvh;padding:76px 12px 20px;overflow:visible}
  .bvh-topbar{flex-direction:column;align-items:flex-start;padding:14px;margin-bottom:14px;gap:9px}
  .bvh-topbar h1{font-size:29px;line-height:1.05}
  .bvh-topbar>div:last-child{text-align:left!important}
  .bvh-grid-4,.bvh-grid-2,.bvh-dossier-grid,.bvh-dossier-grid-wide{grid-template-columns:1fr;gap:12px}
  .bvh-card{padding:15px}
  .bvh-card h2{font-size:29px}
  .bvh-client-row{grid-template-columns:1fr 1fr;gap:7px;padding:13px}
  .bvh-client-row>:first-child{grid-column:1/-1}
  .bvh-client-row>:last-child{grid-column:1/-1}
  .bvh-dossier-head{flex-direction:column;padding:15px;gap:12px}
  .bvh-dossier-head h1{font-size:30px;line-height:1.03}
  .bvh-dossier-head>div:last-child{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  .bvh-dossier-head>div:last-child button{width:100%}
  .bvh-field{grid-template-columns:1fr;gap:4px;padding:11px 0}
  .bvh-upload-line{grid-template-columns:1fr;gap:10px;padding:14px}
  .bvh-doc-grid{grid-template-columns:1fr;padding:12px}
  .bvh-doc-card{min-height:82px}
  .bvh-row{display:flex;flex-wrap:wrap;gap:7px;padding:13px 14px}
  .bvh-row>*{min-width:0}
  .bvh-row>b{flex:1 1 52%;font-size:16px}
  .bvh-row>span{flex:1 1 38%}
  .bvh-row>button,.bvh-row>a{flex:1 1 100%;justify-content:center;text-align:center}
  .bvh-ledger-title{padding:13px 14px}
  .bvh-note-box{min-height:110px}
  .bvh-login-card{width:100%;max-width:420px;padding:26px 20px}
  .bvh-login-logo{width:155px}
  input,select,textarea{font-size:16px!important}
  button{min-height:40px}
}

</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useMemo}=React;
const C={bg:'#0f1117',card:'#1a1d2e',bord:'#2a2d3e',blue:'#4a9eff',gold:'#f0b429',green:'#2ecc71',red:'#ff4444',orange:'#ff8800',txt:'#e2e8f0',muted:'#8892a0'};
const roles={admin:'Administrateur',directeur:'Directeur',co_directeur:'Co-directeur',employe:'Employé'};
const roleRank={employe:1,co_directeur:2,directeur:3,admin:4};
const fCur=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
const fDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR'):'—';
const today=()=>new Date().toISOString().split('T')[0];
const plusDays=(days)=>{const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().split('T')[0];};
const daysDiff=d=>{const a=new Date(d+'T00:00:00'),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.floor((a-b)/86400000);};
const genId=()=>`VH-1904-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
const date1904=()=>{const d=new Date();return d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}).replace(/^./,c=>c.toUpperCase())+' 1904';};

async function call(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts}); const txt=await r.text(); let data; try{data=txt?JSON.parse(txt):{};}catch{data={error:txt||'Réponse invalide'}}; if(!r.ok) throw new Error(data.error||'Erreur serveur'); return data;}
const api={
 login:(username,password)=>call('/api/login',{method:'POST',body:JSON.stringify({username,password})}), logout:()=>call('/api/logout',{method:'POST'}), me:()=>call('/api/me'),
 users:()=>call('/api/users'), addUser:u=>call('/api/users',{method:'POST',body:JSON.stringify(u)}), updateUser:u=>call('/api/users',{method:'PUT',body:JSON.stringify(u)}), deleteUser:id=>call('/api/users',{method:'DELETE',body:JSON.stringify({id})}),
 clients:()=>call('/api/clients'), addClient:c=>call('/api/clients',{method:'POST',body:JSON.stringify(c)}), updateClient:c=>call('/api/clients',{method:'PUT',body:JSON.stringify(c)}), deleteClient:id=>call('/api/clients',{method:'DELETE',body:JSON.stringify({id})}),
 loans:()=>call('/api/loans'), addLoan:l=>call('/api/loans',{method:'POST',body:JSON.stringify(l)}), updateLoan:l=>call('/api/loans',{method:'PUT',body:JSON.stringify(l)}), deleteLoan:id=>call('/api/loans',{method:'DELETE',body:JSON.stringify({id})}), logs:()=>call('/api/logs'),
 documents:client_id=>call('/api/client_documents?client_id='+encodeURIComponent(client_id)), uploadDocument:d=>call('/api/client_documents',{method:'POST',body:JSON.stringify(d)}), deleteDocument:id=>call('/api/client_documents',{method:'DELETE',body:JSON.stringify({id})}), notes:client_id=>call('/api/client_notes?client_id='+encodeURIComponent(client_id)), addNote:d=>call('/api/client_notes',{method:'POST',body:JSON.stringify(d)}), deleteNote:id=>call('/api/client_notes',{method:'DELETE',body:JSON.stringify({id})}), horseCredits:()=>call('/api/horse_credits'), addHorseCredit:h=>call('/api/horse_credits',{method:'POST',body:JSON.stringify(h)}), updateHorseCredit:h=>call('/api/horse_credits',{method:'PUT',body:JSON.stringify(h)}), deleteHorseCredit:id=>call('/api/horse_credits',{method:'DELETE',body:JSON.stringify({id})})
};
function payment(capital,rate,n){capital=Number(capital);rate=Number(rate)/100;n=parseInt(n);if(!capital||!n)return 0;if(!rate)return capital/n;return capital*rate/(1-Math.pow(1+rate,-n));}
function schedule({capital,rate,n,start}){const p=payment(capital,rate,n); const e=[]; for(let i=0;i<n;i++){const d=new Date(start+'T12:00:00');d.setDate(d.getDate()+i*7);e.push({montant:Number(p.toFixed(2)),date:d.toISOString().split('T')[0],statut:'attente'});} return {echeances:e,total:Number((p*n).toFixed(2)),montant:Number(p.toFixed(2))};}
function st(e){if(e.statut==='paye')return 'paye'; const d=daysDiff(e.date); return d<0?'retard':d===0?'aujourdhui':'avenir';}
const ST={retard:['#ff4444','#fff','En retard'],aujourdhui:['#ff8800','#fff',"Aujourd'hui"],avenir:['#e6b800','#111','À venir'],paye:['#2ecc71','#fff','Payé']};
function Badge({s}){const a=ST[s]||ST.avenir;return <span style={{padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:700,background:a[0],color:a[1]}}>{a[2]}</span>}
function Btn({children,onClick,color=C.blue,disabled,full,style={}}){return <button disabled={disabled} onClick={onClick} style={{background:disabled?'#2a2d3e':color,color:'#fff',border:'none',borderRadius:8,padding:'9px 14px',fontWeight:700,cursor:disabled?'not-allowed':'pointer',display:'inline-flex',alignItems:'center',justifyContent:full?'center':'flex-start',gap:8,width:full?'100%':'auto',...style}}>{children}</button>}
function Inp({label,error,...p}){return <div style={{display:'flex',flexDirection:'column',gap:5}}>{label&&<label style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:C.muted}}>{label}</label>}<input {...p} style={{background:'#13151f',border:'1px solid '+(error?C.red:C.bord),borderRadius:8,padding:'9px 12px',color:C.txt,outline:'none',width:'100%',...(p.style||{})}}/>{error&&<span style={{color:C.red,fontSize:12}}>{error}</span>}</div>}
function Select({label,value,onChange,children}){return <div style={{display:'flex',flexDirection:'column',gap:5}}><label style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:C.muted}}>{label}</label><select value={value} onChange={onChange} style={{background:'#13151f',border:'1px solid '+C.bord,borderRadius:8,padding:'9px 12px',color:C.txt,outline:'none',width:'100%'}}>{children}</select></div>}
function Txt({label,error,...p}){return <div style={{display:'flex',flexDirection:'column',gap:5}}>{label&&<label style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:C.muted}}>{label}</label>}<textarea {...p} style={{background:'#13151f',border:'1px solid '+(error?C.red:C.bord),borderRadius:8,padding:'9px 12px',color:C.txt,outline:'none',width:'100%',minHeight:80,...(p.style||{})}}/>{error&&<span style={{color:C.red,fontSize:12}}>{error}</span>}</div>}
function Sec({children}){return <p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:C.blue,margin:'18px 0 12px'}}>{children}</p>}
function Toast({msg}){return msg?<div style={{position:'fixed',top:20,right:20,zIndex:999,background:C.card,border:'1px solid '+C.gold,color:C.gold,borderRadius:10,padding:'12px 18px',boxShadow:'0 8px 24px #0008'}}>{msg}</div>:null}

function Login({onLogin}){const[u,setU]=useState(''),[p,setP]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);async function go(){try{setBusy(true);setErr('');const r=await api.login(u,p);onLogin(r.user);}catch(e){setErr(e.message)}finally{setBusy(false)}}return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'radial-gradient(circle at top,#3a250f,#0b0704 60%)',padding:20}}><div className="bvh-login-card"><div style={{textAlign:'center',marginBottom:24}}><img className="bvh-login-logo" src="/logo-vh.png" alt="Banque Van Horn"/><h1 style={{color:'#f6d27b',fontSize:30}}>Banque Van Horn</h1><p style={{color:'#d3b574',fontSize:13,letterSpacing:'.12em',textTransform:'uppercase'}}>Système interne sécurisé • 1904</p></div>{err&&<div style={{background:'#6b1c1622',border:'1px solid '+C.red,color:'#ffb0a6',borderRadius:8,padding:10,marginBottom:12}}>⚠ {err}</div>}<div style={{display:'flex',flexDirection:'column',gap:14}}><Inp label="Identifiant" value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} autoFocus/><Inp label="Mot de passe" type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()}/><Btn full color="#8b642c" onClick={go} disabled={busy}>{busy?'Connexion…':'Se connecter'}</Btn></div></div></div>}

function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=reject;reader.readAsDataURL(file);});}

function clientCode(c){return `BVH-1904-${String(c.id||'').slice(0,4).toUpperCase().padEnd(4,'0')}`;}
function clientFullName(c){return `${c.prenom||''} ${c.nom||''}`.trim();}
function clientLoans(c,loans){const cid=String(c.id||'');const name=clientFullName(c).toLowerCase();return (loans||[]).filter(l=>String(l.client_id||'')===cid || `${l.prenom||''} ${l.nom||''}`.trim().toLowerCase()===name);}
function calcClientStats(c,loans){const ls=clientLoans(c,loans);const total=ls.reduce((s,l)=>s+Number(l.somme||0),0);const expected=ls.reduce((s,l)=>s+Number(l.total_a_rembourser||0),0);const paid=ls.reduce((s,l)=>s+(l.echeances||[]).filter(e=>e.statut==='paye').reduce((a,e)=>a+Number(e.montant||0),0),0);const active=ls.filter(l=>(l.echeances||[]).some(e=>e.statut!=='paye')).length;const late=ls.reduce((s,l)=>s+(l.echeances||[]).filter(e=>e.statut!=='paye'&&daysDiff(e.date)<0).length,0);return{loans:ls,total,expected,paid,active,late};}

function ClientDossier({client,loans,onBack,onEdit,onDelete}){const stt=calcClientStats(client,loans);return <div><button onClick={onBack} style={{background:'none',border:'none',color:'#f3d58a',cursor:'pointer',marginBottom:14,fontWeight:900}}>← Retour au registre des clients</button><div className="bvh-dossier-head"><div><div className="bvh-dossier-code">Dossier {clientCode(client)}</div><h1>{clientFullName(client)}</h1><p style={{color:'#b69b68'}}>Fiche client officielle — Banque Van Horn</p></div><div style={{display:'flex',gap:8,alignItems:'center'}}><Btn color="#5f4725" onClick={()=>onEdit(client)}>Modifier</Btn><Btn color={C.red} onClick={()=>onDelete(client)}>Supprimer</Btn></div></div><div className="bvh-grid-4"><InfoCard icon="📜" title="Prêts enregistrés" value={stt.loans.length} note="Historique bancaire"/><InfoCard icon="⏳" title="Prêts en cours" value={stt.active} note="Non soldés"/><InfoCard icon="💰" title="Total emprunté" value={fCur(stt.total)} note="Capital nominal"/><InfoCard icon="✅" title="Total remboursé" value={fCur(stt.paid)} note="Paiements validés"/></div><div className="bvh-dossier-grid-wide"><div className="bvh-ledger"><div className="bvh-ledger-title">Informations générales</div><div style={{padding:'8px 16px 16px'}}><div className="bvh-field"><b>Nom complet</b><span>{clientFullName(client)}</span></div><div className="bvh-field"><b>Télégramme</b><span>{client.telegram||'—'}</span></div><div className="bvh-field"><b>Adresse / État</b><span>{client.adresse||'—'}</span></div><div className="bvh-field"><b>Statut</b><span>{stt.late>0?'🔴 Paiement en retard':'🟢 Dossier à jour'}</span></div></div></div><DocumentPanel client={client}/></div><div className="bvh-dossier-grid-wide"><NotesPanel client={client}/><div className="bvh-ledger"><div className="bvh-ledger-title">Résumé du dossier</div><div style={{padding:'8px 16px 16px'}}><div className="bvh-field"><b>Paiements en retard</b><span>{stt.late}</span></div><div className="bvh-field"><b>Prêts e function LoanDetail({loan,onBack,onUpdate,onDelete,notify}){const paid=loan.echeances.filter(e=>e.statut==='paye').reduce((s,e)=>s+Number(e.montant),0);async function mark(i,val){const es=[...loan.echeances];es[i]={...es[i],statut:val?'paye':'attente'};try{const u=await api.updateLoan({id:loan.id,echeances:es});onUpdate(u);notify(val?'Paiement validé':'Paiement annulé')}catch(e){notify('⚠ '+e.message)}}return <div><button onClick={onBack} style={{background:'none',border:'none',color:C.blue,cursor:'pointer',marginBottom:16}}>← Retour</button><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><h1>{loan.prenom} {loan.nom}</h1><code style={{background:C.bord,padding:'5px 10px',borderRadius:6,color:C.blue}}>{loan.loan_id}</code></div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:16}}><div style={{background:C.card,border:'1px solid '+C.bord,borderRadius:12,padding:16}}><p>📱 {loan.telegram||'—'}</p><p>🏦 {loan.banquier_username}</p><p>Garanties : {loan.garanties||'—'}</p></div><div style={{background:C.card,border:'1px solid '+C.bord,borderRadius:12,padding:16}}><p>Somme : <b>{fCur(loan.somme)}</b></p><p>Total : <b>{fCur(loan.total_a_rembourser)}</b></p><p>Payé : <b style={{color:C.green}}>{fCur(paid)}</b></p><p>Restant : <b style={{color:C.gold}}>{fCur(loan.total_a_rembourser-paid)}</b></p></div></div><div style={{display:'flex',gap:10,marginBottom:14}}><Btn onClick={()=>onUpdate({...loan,_edit:true})}>Modifier le prêt</Btn><Btn color={C.red} onClick={()=>onDelete(loan)}>Supprimer le prêt</Btn></div><div style={{background:C.card,border:'1px solid '+C.bord,borderRadius:12,overflow:'hidden'}}>{loan.echeances.map((e,i)=><div key={i} style={{display:'grid',gridTemplateColumns:'70px 1fr 130px 140px 180px',gap:12,alignItems:'center',padding:12,borderTop:i?'1px solid '+C.bord:'none'}}><span>#{i+1}</span><b>{fCur(e.montant)}</b><span>{fDate(e.date)}</span><Badge s={st(e)}/>{e.statut==='paye'?<Btn color="#555" onClick={()=>mark(i,false)}>Annuler paiement</Btn>:<Btn color={C.green} onClick={()=>mark(i,true)}>Valider paiement</Btn>}</div>)}</div></div>}

function LoansPage({loans,clients,setLoans,notify}){const[modal,setModal]=useState(false),[sel,setSel]=useState(null),[edit,setEdit]=useState(null); async function save(l){try{const u=l.id?await api.updateLoan(l):await api.addLoan(l);setLoans(l.id?loans.map(x=>x.id===u.id?u:x):[u,...loans]);notify(l.id?'Prêt modifié':'Prêt créé')}catch(e){notify('⚠ '+e.message)}} async function del(l){if(!confirm('Supprimer définitivement ce prêt ?'))return;try{await api.deleteLoan(l.id);setLoans(loans.filter(x=>x.id!==l.id));setSel(null);notify('Prêt supprimé')}catch(e){notify('⚠ '+e.message)}} if(sel){if(sel._edit){return <><LoanModal open={true} loan={sel} clients={clients} onClose={()=>setSel(loans.find(x=>x.id===sel.id))} onSave={save}/></>} return <LoanDetail loan={sel} onBack={()=>setSel(null)} onUpdate={u=>u._edit?setSel(u):(setLoans(loans.map(x=>x.id===u.id?u:x)),setSel(u))} onDelete={del} notify={notify}/>}return <div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}><h1>Prêts</h1><Btn onClick={()=>setModal(true)}>+ Nouveau prêt</Btn></div><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>{loans.map(l=>{const next=l.echeances.find(e=>e.statut!=='paye');return <div key={l.id} onClick={()=>setSel(l)} style={{background:C.card,border:'1px solid '+C.bord,borderLeft:'4px solid '+(l.echeances.some(e=>st(e)==='retard')?C.red:C.blue),borderRadius:12,padding:16,cursor:'pointer'}}><b>{l.prenom} {l.nom}</b><p style={{color:C.muted,marginTop:6}}>{l.loan_id}</p><p>{fCur(l.somme)} → {fCur(l.total_a_rembourser)}</p>{next&&<Badge s={st(next)}/>}</div>})}</div><LoanModal open={modal} onClose={()=>setModal(false)} onSave={save} clients={clients}/></div>}

function Check({label,checked,onChange}){return <label style={{display:'flex',gap:8,alignItems:'center',color:'#d8bf82',fontWeight:700}}><input type="checkbox" checked={!!checked} onChange={e=>onChange(e.target.checked)}/>{label}</label>}
function horseDiscord(f){const coupons=(f.numeros_coupons||'').split('\n').map(x=>x.trim()).filter(Boolean);const check=v=>v?'[x]':'[]';return `## DOSSIER DE CRÉDIT DE MISE HIPPIQUE ##\n\n**INFORMATIONS PERSONNELLES**\n        **Date du jour :** ${f.date_du_jour||'JJ/MM/AAAA'}\n        **Télégramme :** ${f.telegram||''}\n        **Adresse résidentielle actuelle :** ${f.adresse||''}\n        **Profession actuelle :** ${f.profession||''}\n\n**VÉRIFICATION D’IDENTITÉ**\n        ${check(f.identite_presentee)} Pièce d’identité valide présentée\n        ${check(f.photographie_ajoutee)} Photographie du client réalisée et ajoutée au dossier\n        **Lien pièce d’identité :** ${f.piece_identite_url||''}\n        **Lien photographie :** ${f.photographie_url||''}\n\n**DEMANDE DE CRÉDIT DE MISE**\n        **Montant total emprunté :** 25$ x ${f.coupons_count||1} = ${25*(Number(f.coupons_count)||1)}$\n        **Taux d’intérêt FIXE appliqué :** ${f.taux||0} %\n\n**INFORMATIONS SUR LE PARI HIPPIQUE**\n        **Date de la course :** ${f.date_course||'JJ/MM/AAAA'}\n        **Nom de l’écurie ou du cheval sélectionné :** ${f.cheval_ecurie||''}\n        **Type de pari envisagé :**\n        ${check(f.type_pari==='gagnant')} Gagnant\n        ${check(f.type_pari==='place')} Placé\n        ${check(f.type_pari==='couple')} Couplé\n        ${check(f.type_pari==='autre')} Autres : ${f.type_pari_autre||''}\n\n        **Bookmaker partenaire chargé de la prise de pari :** ${f.bookmaker||''}\n\n**COUPONS DE MISE**\n        **Numéros de série des coupons remis :**\n${coupons.length?coupons.map(x=>'        N°'+x).join('\n'):'        N°____'}\n\n        ${check(f.coupons_enregistres)} Coupons enregistrés dans le registre officiel\n        ${check(f.numeros_verifies)} Vérification des numéros de série effectuée\n\n**SITUATION FINANCIÈRE**\n        **Revenus mensuels estimés :** ${f.revenus_mensuels||''}\n        **Patrimoine déclaré :** ${f.patrimoine||''}\n        **Biens susceptibles de garantir le remboursement :** ${f.garanties||''}\n\n**RÉFÉRENCES**\n        **Êtes-vous recommandé par un employé, client ou partenaire de l’Hippodrome Howley & Co. ou de l'institution ?**\n        ${check(f.recommande)} Oui\n        ${check(!f.recommande)} Non\n\n        **Si oui, précisez le nom du référent :** ${f.referent||''}\n        **Autres recommandations :** ${f.recommandations||''}\n\n**DÉCLARATIONS ET ACCEPTATION**\n        ${check(f.a1)} Je reconnais que les coupons demeurent la propriété de la banque jusqu’à leur utilisation.\n        ${check(f.a2)} Je m’engage à rembourser immédiatement le financement accordé après la course hippique.\n        ${check(f.a3)} En cas de gains, j’accepte de rembourser le montant emprunté ainsi que les intérêts convenus.\n        ${check(f.a4)} J’accepte que mes biens personnels puisse être saisi en cas de défaut de paiement.\n        ${check(f.a5)} Je certifie l’exactitude des informations fournies.\n        ${check(f.a6)} J’accepte les conditions générales du service de crédit de mise hippique.\n\n*Le demandeur reconnaît qu’un crédit de mise hippique constitue un engagement financier immédiat et que tout défaut de remboursement pourra entraîner des mesures de recouvrement, des saisies patrimoniales, une procédure judiciaire fédérale ainsi que l’inscription dans les registres officiels des débiteurs insolvables.*\n\n*Par sa signature, le demandeur atteste avoir pris connaissance de l’ensemble des présentes conditions et les accepter sans réserve.*`}

function HorseCreditPage({clients,notify}){
  const empty={
    id:null,dossier_id:'',client_id:'',client_nom:'',client_prenom:'',telegram:'',adresse:'',profession:'',
    date_du_jour:new Date().toLocaleDateString('fr-FR'),
    identite_presentee:false,photographie_ajoutee:false,piece_identite_url:'',photographie_url:'',
    coupons_count:1,taux:0,date_course:'',cheval_ecurie:'',type_pari:'gagnant',type_pari_autre:'',
    bookmaker:'',numeros_coupons:'',coupons_enregistres:false,numeros_verifies:false,
    revenus_mensuels:'',patrimoine:'',garanties:'',recommande:false,referent:'',recommandations:'',
    a1:false,a2:false,a3:false,a4:false,a5:false,a6:false,statut:'en_cours'
  };
  const[f,setF]=useState(empty);
  const[credits,setCredits]=useState([]);
  const[busy,setBusy]=useState(false);
  const[view,setView]=useState(null);
  const[query,setQuery]=useState('');

  useEffect(()=>{api.horseCredits().then(setCredits).catch(e=>notify('⚠ '+e.message))},[]);

  function fromCredit(c){
    const acc=c.acceptations||{};
    return {
      ...empty,
      ...c,
      client_id:c.client_id||'',
      numeros_coupons:Array.isArray(c.numeros_coupons)?c.numeros_coupons.join('\n'):'',
      a1:!!acc.a1,a2:!!acc.a2,a3:!!acc.a3,a4:!!acc.a4,a5:!!acc.a5,a6:!!acc.a6,
      statut:c.statut||'en_cours'
    };
  }

  function payloadFromForm(){
    const discord=horseDiscord(f);
    return {
      ...f,
      numeros_coupons:String(f.numeros_coupons||'').split('\n').map(x=>x.trim()).filter(Boolean),
      acceptations:{a1:f.a1,a2:f.a2,a3:f.a3,a4:f.a4,a5:f.a5,a6:f.a6},
      discord_text:discord
    };
  }

  function resetForm(){setF(empty);setView(null);}
  function pick(id){const c=clients.find(x=>String(x.id)===String(id));setF({...f,client_id:id,client_nom:c?.nom||'',client_prenom:c?.prenom||'',telegram:c?.telegram||'',adresse:c?.adresse||''});}
  const discord=horseDiscord(f);

  async function copy(text=discord){await navigator.clipboard.writeText(text);notify('Formulaire Discord copié')}
  async function save(){
    try{
      setBusy(true);
      const payload=payloadFromForm();
      const r=payload.id?await api.updateHorseCredit(payload):await api.addHorseCredit(payload);
      setCredits(payload.id?credits.map(x=>x.id===r.id?r:x):[r,...credits]);
      setView(r);
      setF(fromCredit(r));
      notify(payload.id?'Crédit hippique modifié':'Crédit hippique enregistré');
    }catch(e){notify('⚠ '+e.message)}
    finally{setBusy(false)}
  }
  async function remove(c){
    if(!confirm(`Supprimer définitivement le dossier ${c.dossier_id} ?`))return;
    try{
      await api.deleteHorseCredit(c.id);
      setCredits(credits.filter(x=>x.id!==c.id));
      if(view?.id===c.id)setView(null);
      if(f.id===c.id)resetForm();
      notify('Crédit hippique supprimé');
    }catch(e){notify('⚠ '+e.message)}
  }
  function edit(c){setView(null);setF(fromCredit(c));window.scrollTo({top:0,behavior:'smooth'});}
  function show(c){setView(c);window.scrollTo({top:0,behavior:'smooth'});}
  function badgeStatus(s){
    const map={en_cours:['#8b642c','En cours'],termine:['#3f9b67','Terminé'],refuse:['#b94735','Refusé']};
    const v=map[s]||map.en_cours;
    return <span style={{background:v[0],color:'#fff',borderRadius:20,padding:'4px 10px',fontWeight:900,fontSize:12}}>{v[1]}</span>
  }

  const filtered=credits.filter(c=>`${c.dossier_id||''} ${c.client_prenom||''} ${c.client_nom||''} ${c.telegram||''}`.toLowerCase().includes(query.toLowerCase()));

  return <div>

        {f.id&&<Btn color="#555" onClick={resetForm}>Nouveau dossier</Btn>}

        <Btn color="#8b642c" disabled={busy} onClick={save}>{busy?'Enregistrement…':f.id?'Enregistrer les modifications':'Enregistrer'}</Btn>
      </div>
    </div>

    {view&&<div className="bvh-ledger" style={{marginBottom:14}}>

        <span>Dossier enregistré — {view.dossier_id}</span>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Btn color="#5f4725" onClick={()=>copy(view.discord_text||horseDiscord(fromCredit(view)))}>Copier Discord</Btn>
          <Btn color="#8b642c" onClick={()=>edit(view)}>Modifier</Btn>
          <Btn color={C.red} onClick={()=>remove(view)}>Supprimer</Btn>

        </div>
      </div>
      <div style={{padding:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>

          <div className="bvh-field"><b>Télégramme</b><span>{view.telegram||'—'}</span></div>
          <div className="bvh-field"><b>Adresse</b><span>{view.adresse||'—'}</span></div>
          <div className="bvh-field"><b>Profession</b><span>{view.profession||'—'}</span></div>
          <div className="bvh-field"><b>Montant</b><span>{fCur(view.montant_total)}</span></div>
          <div className="bvh-field"><b>Taux</b><span>{view.taux||0} %</span></div>
          <div className="bvh-field"><b>Statut</b><span>{badgeStatus(view.statut)}</span></div>

          <div className="bvh-field"><b>Cheval / écurie</b><span>{view.cheval_ecurie||'—'}</span></div>
          <div className="bvh-field"><b>Type de pari</b><span>{view.type_pari||'—'} {view.type_pari_autre||''}</span></div>
          <div className="bvh-field"><b>Bookmaker</b><span>{view.bookmaker||'—'}</span></div>
          <div className="bvh-field"><b>Pièce d'identité</b><span>{view.piece_identite_url?<a href={view.piece_identite_url} target="_blank" rel="noreferrer" style={{color:'#f3d58a'}}>Consulter</a>:'—'}</span></div>

        </div>
      </div>
      <pre style={{whiteSpace:'pre-wrap',padding:16,color:'#f0d899',fontSize:13,lineHeight:1.45,maxHeight:360,overflow:'auto',borderTop:'1px solid #6d4b2266'}}>{view.discord_text||horseDiscord(fromCredit(view))}</pre>
    </div>}

          <Inp label="Adresse résidentielle actuelle" value={f.adresse} onChange={e=>setF({...f,adresse:e.target.value})}/>
          <Inp label="Profession actuelle" value={f.profession} onChange={e=>setF({...f,profession:e.target.value})}/>

        <input placeholder="Rechercher un dossier..." value={query} onChange={e=>setQuery(e.target.value)} style={{background:'#120b06',border:'1px solid #62451f',borderRadius:8,padding:'8px 10px',color:'#f8e7b7',minWidth:260}}/>
      </div>
      {filtered.length===0?<p className="bvh-empty">Aucun crédit hippique enregistré.</p>:filtered.map(c=><div className="bvh-row" key={c.id} style={{gridTemplateColumns:'1.2fr 1.2fr 100px 95px 250px'}}>
        <b>{c.dossier_id}</b>
        <span>{c.client_prenom} {c.client_nom}</span>
        <span>{fCur(c.montant_total)}</span>
        <span>{badgeStatus(c.statut)}</span>
        <span style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <Btn color="#555" onClick={()=>show(c)}>Voir</Btn>
          <Btn color="#8b642c" onClick={()=>edit(c)}>Modifier</Btn>
          <Btn color={C.red} onClick={()=>remove(c)}>Supprimer</Btn>
        </span>
      </div>)}
    </div>
  </div>
}

function Dashboard({loans,clients,logs,me,onMark}){const upcoming=[];loans.forEach(l=>(l.echeances||[]).forEach((e,i)=>{if(e.statut!=='paye'){const d=daysDiff(e.date); if(d<=7) upcoming.push({...e,loan:l,i,d});}}));upcoming.sort((a,b)=>new Date(a.date)-new Date(b.date));const total7=upcoming.reduce((s,e)=>s+Number(e.montant),0);const capitalPrete=loans.reduce((s,l)=>s+Number(l.somme||0),0);const totalAttendu=loans.reduce((s,l)=>s+Number(l.total_a_rembourser||0),0);const encaisse=loans.reduce((s,l)=>s+(l.echeances||[]).filter(e=>e.statut==='paye').reduce((a,e)=>a+Number(e.montant||0),0),0);const restant=Math.max(totalAttendu-encaisse,0);const retards=upcoming.filter(e=>e.d<0).length;const derniers=(logs||[]).slice(0,5);return <div><div className="bvh-topbar"><div><small>Système interne sécurisé</small><h1>Tableau de bord</h1></div><div style={{textAlign:'right',color:'#d8bc78'}}><b>{date1904()}</b><br/><span>{me?.username} — {roles[me?.role]}</span></div></div><div className="bvh-grid-4"><InfoCard icon="🏛️" title="Capital prêté" value={fCur(capitalPrete)} note="Montant nominal accordé"/><InfoCard icon="💰" title="Capital à récupérer" value={fCur(restant)} note="Reste à encaisser"/><InfoCard icon="📜" title="Prêts actifs" value={loans.length} note={`${clients.length} clients enregistrés`}/><InfoCard icon="⚠️" title="Retards" value={retards} note="Échéances dépassées"/></div><div className="bvh-grid-4"><InfoCard icon="📆" title="À encaisser 7 jours" value={fCur(total7)} note="Prochaines échéances"/><InfoCard icon="✅" title="Déjà encaissé" value={fCur(encaisse)} note="Paiements validés"/><InfoCard icon="📚" title="Dossiers clients" value={clients.length} note="Registre clientèle"/><InfoCard icon="🕰️" title="Exercice" value="1904" note="Banque Van Horn"/></div><div className="bvh-grid-2"><div className="bvh-ledger"><div className="bvh-ledger-title">Échéances à traiter</div>{upcoming.length===0?<p className="bvh-empty">Aucune échéance.</p>:upcoming.map((e,i)=><div className="bvh-row" key={i}><b>{e.loan.prenom} {e.loan.nom}</b><span>{fCur(e.montant)}</span><span>{fDate(e.date)}</span><Badge s={st(e)}/><Btn color={C.green} onClick={()=>onMark(e.loan,e.i,true)}>Valider paiement</Btn></div>)}</div><div className="bvh-ledger"><div className="bvh-ledger-title">Dernières opérations</div>{derniers.length===0?<p className="bvh-empty">Aucune opération récente.</p>:derniers.map(l=><div className="bvh-activity" key={l.id}><b>{l.username}</b><br/><span>{l.action}</span><br/><small style={{color:'#9f8550'}}>{new Date(l.created_at).toLocaleString('fr-FR')}</small></div>)}</div></div></div>}
function InfoCard({icon,title,value,note}){return <div className="bvh-card"><div className="icon">{icon}</div><p>{title}</p><h2>{value}</h2><small style={{color:'#8f7547'}}>{note}</small></div>}
function Card({title,value,icon,color}){return <InfoCard icon={icon} title={title} value={value} note=""/>}
function EcheancesTable({items,onMark}){return <div className="bvh-ledger">{items.length===0?<p className="bvh-empty">Aucune échéance.</p>:items.map((e,i)=><div key={i} className="bvh-row"><b>{e.loan.prenom} {e.loan.nom}</b><span>{fCur(e.montant)}</span><span>{fDate(e.date)}</span><Badge s={st(e)}/><Btn color={C.green} onClick={()=>onMark(e.loan,e.i,true)}>Valider paiement</Btn></div>)}</div>}
function LogsPage({logs}){return <div><h1 style={{marginBottom:18}}>Logs</h1><div style={{display:'grid',gap:8}}>{logs.map(l=><div key={l.id} style={{background:C.card,border:'1px solid '+C.bord,borderRadius:10,padding:12}}><b>{new Date(l.created_at).toLocaleString('fr-FR')} — {l.username}</b><p style={{color:C.gold}}>{l.action}</p><pre style={{whiteSpace:'pre-wrap',color:C.muted,fontSize:12}}>{JSON.stringify(l.details||{},null,2)}</pre></div>)}</div></div>}

function App(){
  const[me,setMe]=useState(null),[loading,setLoading]=useState(true),[page,setPage]=useState('dashboard'),[toast,setToast]=useState(''),[loans,setLoans]=useState([]),[clients,setClients]=useState([]),[users,setUsers]=useState([]),[logs,setLogs]=useState([]),[menuOpen,setMenuOpen]=useState(false);
  const notify=m=>{setToast(m);setTimeout(()=>setToast(''),3000)};
  async function loadAll(user){const req=[api.loans(),api.clients()]; if(roleRank[user.role]>=2) req.push(api.users()); if(roleRank[user.role]>=2) req.push(api.logs()); const r=await Promise.allSettled(req);setLoans(r[0].status==='fulfilled'?r[0].value:[]);setClients(r[1].status==='fulfilled'?r[1].value:[]); if(r[2]?.status==='fulfilled')setUsers(r[2].value); if(r[3]?.status==='fulfilled')setLogs(r[3].value);}
  useEffect(()=>{(async()=>{try{const r=await api.me();setMe(r.user);await loadAll(r.user);}catch{}finally{setLoading(false)}})()},[]);
  async function onLogin(user){setMe(user);await loadAll(user)}
  async function logout(){await api.logout();setMe(null)}
  async function mark(loan,i,val){const es=[...(loan.echeances||[])];es[i]={...es[i],statut:val?'paye':'attente'};try{const u=await api.updateLoan({id:loan.id,echeances:es});setLoans(loans.map(x=>x.id===u.id?u:x));notify(val?'Paiement validé':'Paiement annulé')}catch(e){notify('⚠ '+e.message)}}
  if(loading)return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>Chargement…</div>;
  if(!me)return <Login onLogin={onLogin}/>;
  const menu=[['dashboard','🏛️','Tableau'],['prets','📜','Prêts'],['clients','👤','Clients'],['hippique','🏇','Crédit hippique']];
  if(roleRank[me.role]>=2) menu.push(['users','🔐','Comptes'],['logs','📖','Journal']);
  const choosePage=(target)=>{setPage(target);setMenuOpen(false)};
  return <div className="bvh-shell"><Toast msg={toast}/>
    <div className="bvh-mobile-top">
      <button className="bvh-mobile-menu-button" aria-label="Ouvrir le menu" onClick={()=>setMenuOpen(!menuOpen)}>{menuOpen?'✕':'☰'}</button>
      <div className="bvh-mobile-title"><b>Banque Van Horn</b><span>Établie en 1904 · {roles[me.role]}</span></div>
    </div>
    <div className={'bvh-menu-backdrop '+(menuOpen?'open':'')} onClick={()=>setMenuOpen(false)}></div>
    <aside className={'bvh-sidebar '+(menuOpen?'open':'')}>
      <div className="bvh-brand"><img src="/logo-vh.png" alt="Banque Van Horn"/><div className="bvh-brand-title">Banque Van Horn</div><div className="bvh-brand-date">Établie en 1904</div></div>
      <nav className="bvh-nav">{menu.map(m=><button key={m[0]} className={page===m[0]?'active':''} onClick={()=>choosePage(m[0])}>{m[1]} {m[2]}</button>)}</nav>
      <div className="bvh-user"><small style={{color:'#9f8550',textTransform:'uppercase',letterSpacing:'.12em'}}>Connecté</small><br/><b>{me.username}</b><p style={{color:'#d0b272',fontSize:13}}>{roles[me.role]}</p><Btn full color="#5f4725" onClick={logout} style={{marginTop:12}}>Déconnexion</Btn></div>
    </aside>
    <main className="bvh-main">{page==='dashboard'&&<Dashboard loans={loans} clients={clients} logs={logs} me={me} onMark={mark}/>} {page==='prets'&&<LoansPage loans={loans} clients={clients} setLoans={setLoans} notify={notify}/>} {page==='clients'&&<ClientsPage clients={clients} setClients={setClients} loans={loans} notify={notify}/>} {page==='hippique'&&<HorseCreditPage clients={clients} notify={notify}/>} {page==='users'&&<UserPanel me={me} users={users} setUsers={setUsers} notify={notify}/>} {page==='logs'&&<LogsPage logs={logs}/>}</main>
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
